# Keeps macOS and Windows at parity: every push builds both apps and runs the
# same end-to-end transcription test on both operating systems.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: App + dashboard JavaScript
        run: |
          for f in app/desktop/*.js test/app-test.js test/multi-test.js test/proxy-app-test.js test/proxy-test.js; do node --check "$f"; done
          node -e "const s=require('fs').readFileSync('server/dashboard/index.html','utf8'); new Function(s.slice(s.indexOf('<script>')+8, s.lastIndexOf('</script>'))); console.log('dashboard ok')"
      - name: Proxy parsing test
        run: node test/proxy-test.js
      - name: Python
        run: python3 -m py_compile server/server.py server/voiceprint.py app/windows/call_transcriber.pyw test/server_e2e.py test/vad_test.py test/voiceprint_test.py test/force_english_test.py test/merge_test.py test/vocab_test.py

  test:
    name: Transcription test (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install server
        working-directory: server
        run: uv sync
      - name: Add ONNX engine on macOS (CI runners have no usable Metal GPU)
        if: runner.os == 'macOS'
        working-directory: server
        run: uv pip install "onnx-asr[cpu,hub]>=0.12"
      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-parakeet-v2-${{ runner.os }}
      - name: End-to-end test (3 overlapping speakers, names, channel)
        working-directory: server
        run: uv run python ../test/server_e2e.py --engine onnx
      - name: Timing test (lines split at the right times)
        working-directory: server
        run: uv run python ../test/timing_test.py --engine onnx
      - name: Voice detection test (noise must not start lines, speech must)
        working-directory: server
        run: uv run python ../test/vad_test.py
      - name: Study mode test (offline, no model)
        working-directory: server
        run: uv run python ../test/study_test.py
      - name: Own-voice test (a second voice near the mic is flagged as background)
        working-directory: server
        run: uv run python ../test/voiceprint_test.py
      - name: Merged calls test (merge, split back, search, delete)
        working-directory: server
        run: uv run python ../test/merge_test.py
      - name: Words to listen for (respelling, 470M beam search, 2B push)
        working-directory: server
        run: uv run python ../test/vocab_test.py
      - name: Transcript order test (spoken order, not transcription order)
        working-directory: server
        run: uv run python ../test/order_test.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install desktop app + test tools
        shell: bash
        run: |
          (cd app/desktop && npm ci --no-audit --no-fund && node node_modules/electron/install.js)
          (cd test && npm ci --no-audit --no-fund)
      - name: Desktop app test (built-in Discord window, fake call, 4 speakers)
        shell: bash
        env: { SERVER_ARGS: "--engine onnx" }
        run: node test/app-test.js "$RUNNER_TEMP/app-test"
      - name: Duplicate track test (two tracks for one person must not mix their audio)
        shell: bash
        env: { SERVER_ARGS: "--engine onnx", SITE_QUERY: "?dup=1" }
        run: node test/app-test.js "$RUNNER_TEMP/dup-test"
      - name: Multi-account test (two calls at once, shared channel, listener mic, transcribe a channel)
        shell: bash
        env: { SERVER_ARGS: "--engine onnx" }
        run: node test/multi-test.js "$RUNNER_TEMP/multi-test"
      - name: Per-account proxy test (separate sessions, Webshare format)
        shell: bash
        run: node test/proxy-app-test.js "$RUNNER_TEMP/proxy-test"

  build-mac:
    name: Build macOS app + Windows package
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build Earshot.app
        run: zsh app/mac/build.sh
      - name: Build Windows package
        run: zsh app/windows/make-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Call-Transcriber-Windows
          path: dist/CallTranscriber-Windows.zip
