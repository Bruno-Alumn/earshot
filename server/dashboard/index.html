<body>
<div class="shell" id="shell" data-view="calls">
<nav class="rail" id="rail" aria-label="Sections">
  <img src="/logo.png" class="rail-logo" width="28" height="28" alt="Earshot">
  <button data-view="calls" title="Calls and the live dashboard (⌘1 / Ctrl+1)" aria-label="Calls"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M3 8h10M3 11.5h6" /></svg><span>Calls</span></button>
  <button data-view="people" title="Everyone who has spoken (⌘2 / Ctrl+2)" aria-label="People"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM1.5 13.5c0-2.2 1.8-4 4-4s4 1.8 4 4M11 7a2 2 0 1 0 0-4M12 9.6c1.5.4 2.5 1.8 2.5 3.4"/></svg><span>People</span></button>
  <button data-view="study" title="Patterns in what was said: words, timing and who talks to whom (⌘3 / Ctrl+3)" aria-label="Study"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.5h12M3.5 11l3-3.5 2.5 2 4-5"/></svg><span>Study</span></button>
  <div class="rail-gap"></div>
  <button data-view="settings" title="Settings (⌘4 / Ctrl+4)" aria-label="Settings"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Settings</span></button>
</nav>
<aside class="side">
  <div class="top">
    <div class="row">
      <h1>Calls</h1>
      <button class="iconbtn" id="side-close" aria-label="Close the call list" title="Close the call list">✕</button>
    </div>
    <input type="search" id="hq" placeholder="Search all transcripts…" aria-label="Search all transcripts">
  </div>
  <div class="calls" id="calls"><div class="empty">No calls yet</div></div>
  <div class="merge-bar" id="merge-bar" hidden><span id="merge-n"></span><button class="ghost" id="merge-cancel">Cancel</button><button class="primary" id="merge-go">Merge</button></div>
</aside>
<div class="app">
  <header>
    <button class="iconbtn" id="toggle-side" title="Show or hide the list of calls (⌘\ / Ctrl+\)" aria-label="Hide calls"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M2.5 3.2h11v9.6h-11zM6 3.2v9.6"/></svg><span class="bl" id="side-l">Hide calls</span></button>
    <button class="iconbtn" id="open-settings" title="Settings (⌘, / Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6.9 1.5h2.2l.35 1.7c.4.15.77.36 1.1.62l1.65-.55 1.1 1.9-1.3 1.15a4.6 4.6 0 0 1 0 1.26l1.3 1.15-1.1 1.9-1.65-.55c-.33.26-.7.47-1.1.62l-.35 1.7H6.9l-.35-1.7a4.4 4.4 0 0 1-1.1-.62l-1.65.55-1.1-1.9 1.3-1.15a4.6 4.6 0 0 1 0-1.26L2.7 5.17l1.1-1.9 1.65.55c.33-.26.7-.47 1.1-.62L6.9 1.5ZM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span class="bl">Settings</span></button>
    <button class="iconbtn" id="customize" title="Move, resize and hide panels" aria-label="Edit layout"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2 3.25C2 2.56 2.56 2 3.25 2h3.5C7.44 2 8 2.56 8 3.25v1.5C8 5.44 7.44 6 6.75 6h-3.5C2.56 6 2 5.44 2 4.75v-1.5ZM2 9.25C2 8.56 2.56 8 3.25 8h3.5C7.44 8 8 8.56 8 9.25v3.5c0 .69-.56 1.25-1.25 1.25h-3.5C2.56 14 2 13.44 2 12.75v-3.5ZM10 3.25c0-.69.56-1.25 1.25-1.25h1.5c.69 0 1.25.56 1.25 1.25v9.5c0 .69-.56 1.25-1.25 1.25h-1.5c-.69 0-1.25-.56-1.25-1.25v-9.5Z"/></svg><span class="bl">Edit layout</span></button>
    <button class="iconbtn" id="toggle-compact" title="Fit every panel and the live transcript on one screen (⌘⇧K / Ctrl+Shift+K)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M6.5 2.5v4h-4M9.5 2.5v4h4M6.5 13.5v-4h-4M9.5 13.5v-4h4"/></svg><span class="bl" id="compact-l">Compact</span></button>
    <div class="brand" style="display:none">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--text-primary)"/>
        <g stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round"><line x1="9" y1="13" x2="9" y2="19"/><line x1="13.5" y1="9" x2="13.5" y2="23"/><line x1="18" y1="12" x2="18" y2="20"/><line x1="22.5" y1="14.5" x2="22.5" y2="17.5"/></g></svg>
      Earshot
    </div>
    <div class="where" id="where"></div>
    <div class="pills">
      <button class="pill" id="p-status" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop" title="Calls, server and speech model"><span class="dot"></span><span>Connecting…</span></button>
      <button class="pill" id="p-auto" hidden role="switch" aria-checked="false"><span class="dot"></span><span id="p-auto-t">Auto</span></button>
      <button class="pill" id="p-mute" hidden title="Mute the call for you; transcription still hears everyone (⌘⇧M / Ctrl+Shift+M)"><span id="p-mute-ic"></span><span id="p-mute-t">Mute call</span></button>
      <button class="pill discord-btn" id="p-discord" hidden title="Show the Discord window (⌘D / Ctrl+D)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M19.3 5.3A16.6 16.6 0 0 0 15.2 4l-.5 1a15 15 0 0 0-5.4 0L8.8 4a16.5 16.5 0 0 0-4.1 1.3C2.1 9.2 1.4 13 1.7 16.7a16.7 16.7 0 0 0 5 2.6l1.1-1.7a11 11 0 0 1-1.7-.8l.4-.3a11.9 11.9 0 0 0 11 0l.4.3-1.7.8 1.1 1.7a16.6 16.6 0 0 0 5-2.6c.4-4.3-.7-8-3-11.4ZM8.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg><span>Discord</span></button>
    </div>
  </header>
  <div class="banner" id="banner" role="status"></div>

  <section class="kpis" id="kpis">
    <div class="kpi"><div class="label" title="Everyone's speaking time added up">Talk time<span class="lx"> (all speakers)</span></div><div class="value" id="k-talk">–</div><div class="sub" id="k-talk-s">&nbsp;</div></div>
    <div class="kpi"><div class="label">Words</div><div class="value" id="k-words">–</div><div class="sub" id="k-words-s">&nbsp;</div></div>
    <div class="kpi"><div class="label" title="People who spoke in this call">People<span class="lx2"> who spoke</span></div><div class="value" id="k-people">–</div><div class="sub" id="k-people-s">&nbsp;</div></div>
    <div class="kpi"><div class="label">Lines</div><div class="value" id="k-lines">–</div><div class="sub" id="k-lines-s">&nbsp;</div></div>
    <div class="kpi"><div class="label" title="Lines that start while someone else is still talking">Talking over</div><div class="value" id="k-cross">–</div><div class="sub" id="k-cross-s">&nbsp;</div></div>
  </section>

  <section class="main" id="layout">
    <div class="card c-feed" data-panel="transcript" data-title="Transcript">
      <div class="head"><h2><span class="live-dot" id="livedot"></span>Transcript</h2><span class="meta" id="feedmeta"></span><input type="search" id="q" placeholder="Search this channel…" aria-label="Search this channel" style="height:26px;width:150px;font-size:12px"><button class="iconbtn" id="export" style="height:26px;font-size:12px" title="Save this channel's log as a file, or copy it as text">Save as file…</button></div>
      <div class="feed" id="feed"><div class="empty">Waiting for someone to speak…</div></div>
      <button class="jump" id="jump">↓ New lines</button>
    </div>
    <div class="col">
      <div class="card c-live" data-panel="live" data-title="In the call now">
        <div class="head"><h2>In the call now</h2><span class="meta" id="nowmeta"></span></div>
        <div class="audio-lost" id="audio-lost" hidden></div>
        <div class="now" id="now"><span class="empty" style="padding:4px 0">No one yet</span></div>
      </div>
      <div class="card c-pers" data-panel="persona" data-title="Personalities" id="c-pers">
        <div class="head"><h2>Personalities</h2><span class="meta" id="pers-meta"></span></div>
        <div class="pers" id="pers"></div>
      </div>
      <div class="card c-res" data-panel="resources" data-title="Resources">
        <div class="head"><h2>Resources</h2><span class="meta" id="res-meta">updated every 2 s</span><button class="iconbtn res-pick" id="res-pick" title="Choose which numbers to show here" aria-label="Choose metrics">Choose metrics</button></div>
        <div class="body"><div class="res" id="res"></div></div>
      </div>
      <div class="card c-talk" data-panel="talk" data-title="Talk time">
        <div class="head"><h2>Talk time</h2><span class="meta" id="talkmeta">click a name to filter</span></div>
        <div class="body"><div class="bars" id="bars"></div></div>
      </div>
      <div class="card c-act" data-panel="activity" data-title="Activity">
        <div class="head"><h2>Activity</h2><span class="meta" id="act-meta"></span>
          <div class="seg" id="act-range" style="margin-left:auto"><button data-r="60" class="on">Last hour</button><button data-r="0">All</button></div>
        </div>
        <div class="legend" id="act-legend"></div>
        <div class="body" style="padding-top:0"><svg id="act" width="100%" height="150" role="img" aria-label="Talk time in each slice of time, by speaker"></svg></div>
      </div>
      <div class="card c-tl" data-panel="timeline" data-title="Timeline">
        <div class="head"><h2>Timeline</h2><span class="meta" id="tl-meta"></span>
          <div class="seg" id="tl-range" style="margin-left:auto" title="How much of the call to show"><button data-m="2">2m</button><button data-m="5">5m</button><button data-m="10">10m</button><button data-m="30">30m</button><button data-m="60">1h</button><button data-m="0">All</button></div></div>
        <div class="body" style="padding-top:0"><svg id="tl" width="100%" height="40" role="img" aria-label="Who spoke when"></svg></div>

function renderWords() {

    for (let w of r.text.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/)) {

  if (setHTML($('#words'), top.map(([w, c]) => `<div class="word"><span class="w"><i style="transform:scaleX(${(c / max).toFixed(3)})"></i><b>${esc(w)}</b></span><span class="c">${c}</span></div>`).join('') || '<div class="empty" style="padding:8px">—</div>'))

function fitChips() {

  const showPerson = async (id) => {

      ${reads ? '<section class="pd-read" aria-label="Personality read"></section>' : ''}
      ${!SHARE && /^\d{15,22}$/.test(id) ? '<section class="pd-voice" aria-label="In voice" hidden></section>' : ''}
      <div class="pd-said"><div class="pd-lines-h"><h3>Everything they said</h3><input type="search" id="plq" placeholder="Search their lines" aria-label="Search their lines"></div>

    det.querySelector('[data-a="save"]').onclick = async () => {
      const md = await fetch('/api/person?format=md&id=' + encodeURIComponent(id)).then((r) => r.text());
      saveFile(`${(p.username || p.name).replace(/[^\w.-]+/g, '_')}.md`, md, 'text/markdown');
    };

    else peopleReadRepaint = null;
    const d = await fetch('/api/person?id=' + encodeURIComponent(id)).then((r) => r.json()).catch(() => null);
    if (peopleSel !== id || !det.isConnected) return;
    voiceSection(det.querySelector('.pd-voice'), id, d);
    const all = d?.lines || [], pb = det.querySelector('.plines'), lq = det.querySelector('#plq');
    const mark = (text, ql) => {                                  // match the raw text, then escape each piece

      let out = '', i = 0;

      const ql = lq.value.trim().toLowerCase();

        html += `<button class="pline" tabindex="-1" data-call="${esc(r.call || '')}" data-t="${r.t}" title="Open this moment in its call"><span class="time">${fmtTime(r.t)}</span><span>${r.speaker && r.speaker !== p.name ? `<i>${esc(r.speaker)}:</i> ` : ''}${mark(r.text, ql)}</span></button>`;

      det.querySelector('.pd-lines-h h3').innerHTML = `Everything they said <small>${ql ? `${plural(hits.length, 'line')} matching` : plural(all.length, 'line')}${cap}</small>`;
      pb.innerHTML = html || (!d ? '<div class="empty-box">Could not load their lines.</div>' : ql ? '<div class="empty-box">None of their lines match.</div>' : '<div class="empty-box">No lines yet.</div>');
      pb.scrollTop = pb.scrollHeight;
      pb.querySelectorAll('.pline').forEach((b) => b.onclick = () => { if (!b.dataset.call) return; showView('calls'); openCall(b.dataset.call, +b.dataset.t); });
    };
    pb.onkeydown = (e) => {                                       // the list is one tab stop; the arrows walk the lines
      const keys = { ArrowDown: 1, ArrowUp: -1, Home: 'first', End: 'last', PageDown: 10, PageUp: -10 };
      if (!(e.key in keys) || e.altKey || e.metaKey || e.ctrlKey) return;

      e.preventDefault();
      const k = keys[e.key], cur = ls.indexOf(document.activeElement);

      if (k === 'first') i = 0; else if (k === 'last') i = ls.length - 1;
      else if (cur >= 0) i = Math.max(0, Math.min(ls.length - 1, cur + k));

        const box = pb.getBoundingClientRect();
        const seen = ls.filter((b) => { const r = b.getBoundingClientRect(); return r.bottom > box.top && r.top < box.bottom; });
        i = ls.indexOf(k > 0 ? seen[0] || ls[0] : seen.at(-1) || ls.at(-1));
      }
      ls[i].focus(); ls[i].scrollIntoView({ block: 'nearest' });
    };
    let lt; lq.oninput = () => { clearTimeout(lt); lt = setTimeout(drawLines, 120); };
    drawLines();
  };
  drawList();
  if (peopleSel) showPerson(peopleSel); else host.querySelector('#pdetail').innerHTML = '<div class="empty-box">Nobody has spoken yet.</div>';
}

// People detail, "In voice": time seen in voice channels, who they are there with, recent sessions.
// From /api/person (its voice key), else /api/voice/person; an older server has neither: the section stays hidden.
async function voiceSection(sec, id, d) {
  if (!sec) return;
  let v = d && typeof d.voice === 'object' ? d.voice : undefined;
  if (v === undefined) {
    if (voiceMissing) return;
    v = await fetch('/api/voice/person?user=' + encodeURIComponent(id)).then((r) => r.ok ? r.json() : null).catch(() => null);
    if (!sec.isConnected || peopleSel !== id) return;
  }
  if (!v || typeof v !== 'object' || v.error) return;
  let allRecent = false;
  const when = (t) => fmtDay(t) === fmtDay(Date.now()) ? 'Today' : fmtDay(t);
  const range = (r) => {
    const a = fmtHM(r.start), b = r.open ? 'now' : fmtHM(r.end);
    return `${when(r.start)}, ${a} to ${fmtDay(r.start) === fmtDay(r.end) || r.open ? b : when(r.end) + ' ' + b}`;
  };
  const chLabel = (ch, g) => esc(String(ch || 'a voice channel')) + (g ? ` <span class="k">· ${esc(String(g))}</span>` : '');
  const paint = () => {
    const recent = Array.isArray(v.recent) ? v.recent : [], withs = Array.isArray(v.with) ? v.with : [];
    const total = v.totalSec || 0, ls = v.lastSeen;
    let body;
    if (!total && !ls && !recent.length) body = '<div class="hint">Not seen in a voice channel yet. Earshot notes who is in the voice channels of the servers it watches, from what Discord shows the main account.</div>';
    else {
      const last = ls ? (ls.now ? ` · in <b>${esc(String(ls.chName || 'a voice channel'))}</b>${ls.guildName ? ' (' + esc(String(ls.guildName)) + ')' : ''} now`
        : ` · last seen in <b>${esc(String(ls.chName || 'a voice channel'))}</b>${ls.guildName ? ' (' + esc(String(ls.guildName)) + ')' : ''} ${esc(ls.at ? ago(ls.at) : '')}`) : '';
      const sum = `<p class="vsum"><b>${esc(fmtDur(total))}</b> in voice${+v.sessions > 0 ? ` over ${plural(Number(v.sessions), 'session')}` : ''}${last}</p>`;
      const wl = withs.length ? `<ul>${withs.map((w) => {
          const nm = String(w.name || 'Someone'), known = w.id && (w.transcripts || peopleById.has(w.id));
          return `<li>${known ? `<button class="n" data-vw="${esc(String(w.id))}" title="Open ${esc(nm)} in People">${esc(nm)}</button>` : `<span class="n" title="${esc(nm)}">${esc(nm)}</span>`}<span class="k">${esc(fmtDur(Number(w.sec) || 0))}</span></li>`;
        }).join('')}</ul>`
        : `<div class="hint">${v.pairsAt == null ? 'Still working this out. It shows a few seconds after the server starts.' : 'Nobody yet.'}</div>`;
      const shown = allRecent ? recent : recent.slice(0, 6);
      const rl = recent.length ? `<ul>${shown.map((r) => `<li><span class="n" title="${esc(String(r.chName || 'a voice channel') + (r.guildName ? ' · ' + r.guildName : ''))}">${chLabel(r.chName, r.guildName)}</span><span class="k">${esc(range(r))}</span>${r.recorded ? '<span class="rec" title="Earshot was recording this channel">Recorded</span>' : ''}</li>`).join('')}</ul>
        ${recent.length > 6 ? `<button class="linkbtn" data-a="vrecent">${allRecent ? 'Show fewer' : `Show all ${recent.length}`}</button>` : ''}` : '<div class="hint">None yet.</div>';
      body = `${sum}<div class="vgrid"><div><h4 class="sh2">Often in voice with</h4>${wl}</div><div><h4 class="sh2">Recent sessions</h4>${rl}</div></div>`;
    }
    sec.innerHTML = `<div class="pd-sec-h"><h3>In voice</h3></div>${body}`;
    sec.hidden = false;
    sec.querySelectorAll('[data-vw]').forEach((b) => b.onclick = () => openPeople(b.dataset.vw));
    const rb = sec.querySelector('[data-a="vrecent"]');
    if (rb) rb.onclick = () => { allRecent = !allRecent; paint(); sec.querySelector('[data-a="vrecent"]')?.focus(); };
  };
  paint();
}

// ---- merging calls: pick two or more, then Merge (undo with "Split back")
const mergeSel = new Set();
const toast = (msg) => window.earshot.ui.toast(msg);
function toggleMergeSel(id) { mergeSel.has(id) ? mergeSel.delete(id) : mergeSel.add(id); renderMergeBar(); renderCalls(); }
function renderMergeBar() {
  const bar = $('#merge-bar'), n = mergeSel.size;
  bar.hidden = !n;
  $('#merge-n').textContent = n < 2 ? 'Pick another call to merge with' : `${n} calls picked`;
  $('#merge-go').disabled = n < 2;
  $('#merge-go').textContent = n < 2 ? 'Merge' : `Merge ${n} calls`;
}
$('#merge-cancel').onclick = () => { mergeSel.clear(); renderMergeBar(); renderCalls(); };
$('#merge-go').onclick = async () => {
  if (mergeSel.size < 2) return;
  const r = await api('/api/merge?ids=' + encodeURIComponent([...mergeSel].join(','))).catch(() => null);
  mergeSel.clear(); renderMergeBar();
  if (!r?.ok) { toast(r?.error ? 'Could not merge: ' + r.error : 'Could not merge those calls.'); renderCalls(); return; }
  dayCache.clear(); await loadCalls(); await openCall(r.id);
  toast(`Merged ${r.parts} calls into one.`);
};
addEventListener('keydown', (e) => { if (e.key === 'Escape' && mergeSel.size) { mergeSel.clear(); renderMergeBar(); renderCalls(); } });

// ---- right-click: archive / unarchive / delete
const api = (path) => fetch(path, { headers: { 'X-CT': '1' } }).then((r) => r.json());
let ctxOpener = null;
// the call list repaints during live calls: find the same row (or its ⋯) after a repaint
function sameRow(el) {
  if (!el || el.isConnected) return el;
  const row = el.closest?.('[data-kind][data-key]'); if (!row) return null;
  const again = document.querySelector(`#calls [data-kind="${CSS.escape(row.dataset.kind)}"][data-key="${CSS.escape(row.dataset.key)}"]`);
  return again && el.classList.contains('more') ? again.querySelector('.more') || again : again;
}
function closeCtx() {
  const m = $('#ctx'), wasOpen = m.style.display === 'block', inside = m.contains(document.activeElement);
  m.style.display = 'none';
  const back = wasOpen && inside && sameRow(ctxOpener);
  if (back) back.focus({ preventScroll: true });
  if (wasOpen) ctxOpener = null;
}
// ⋯ on a call opens the same menu as right-click (by mouse, or Enter / Space when it has focus)
const openMore = (m) => {
  const r = m.getBoundingClientRect();
  ctxOpener = m;
  m.closest('.call').dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: r.left, clientY: r.bottom + 2 }));
};
$('#calls').addEventListener('click', (e) => {
  const m = e.target.closest?.('.more'); if (!m) return;
  e.preventDefault(); e.stopPropagation();
  openMore(m);
}, true);
$('#calls').addEventListener('keydown', (e) => {
  const m = e.target.closest?.('.more'); if (!m || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); e.stopPropagation();
  openMore(m);
});
$('#calls').addEventListener('contextmenu', (e) => {
  const el = e.target.closest('[data-kind]');
  if (!el) return;
  e.preventDefault();
  if (!ctxOpener || !el.contains(ctxOpener)) ctxOpener = el;
  const { kind, key, label, arch } = el.dataset;
  const what = kind === 'server' ? 'server' : kind === 'channel' ? 'channel' : 'call';
  // a channel row is every Discord channel of that name in the server: act on each of them
  const chObj = kind === 'channel' ? channels.find((x) => x.id === key) : null;
  const keys = chObj ? chObj.chKeys : [key];
  const each = (f) => Promise.all(keys.map((k2) => api(f(encodeURIComponent(k2)))));
  // the first item gets focus, so it is the harmless one; Archive and Delete sit apart at the end
  const items = [['export', `Save ${what} as file…`]];
  if (kind === 'call') {
    items.push(['merge', mergeSel.size && !mergeSel.has(key) ? 'Add to the calls to merge' : 'Merge with other calls…']);
    const parts = +(el.dataset.parts || 1);
    if (parts > 1) items.push(['unmerge', `Split back into ${parts} calls`]);
  }
  items.push(['sep']);
  if (arch) items.push(['unarchive', arch.startsWith(kind + ':') ? `Unarchive ${what}` : 'Unarchive (restores the whole archived group)']);
  else items.push(['archive', `Archive ${what}`]);
  items.push(['sep']);
  items.push(['delete', `Delete ${what}…`, 'danger']);
  const m = $('#ctx');
  m.setAttribute('aria-label', `${what[0].toUpperCase() + what.slice(1)} options`);
  m.innerHTML = `<div class="ttl">${esc(label)}</div>` + items.map(([a, t, cls]) => a === 'sep' ? '<div class="sep" role="separator"></div>' : `<button role="menuitem" data-a="${a}" class="${cls || ''}">${esc(t)}</button>`).join('');
  m.style.display = 'block';
  // the menu key / Shift+F10 sends no position: open it under the row
  let x = e.clientX, y = e.clientY;
  if (!x && !y) { const r = el.getBoundingClientRect(); x = r.left + 12; y = r.bottom + 2; }
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
  m.querySelector('button')?.focus();
  m.onkeydown = (ev) => {
    const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    if (ev.key === 'ArrowDown') { ev.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    else if (ev.key === 'Home') { ev.preventDefault(); bs[0].focus(); }
    else if (ev.key === 'End') { ev.preventDefault(); bs.at(-1).focus(); }
    else if (ev.key === 'Tab') { ev.preventDefault(); closeCtx(); }
  };
  m.querySelectorAll('button').forEach((b) => b.onclick = async () => {
    closeCtx();
    const a = b.dataset.a;
    if (a === 'merge') { mergeSel.add(key); renderMergeBar(); renderCalls(); if (mergeSel.size < 2) toast('Now click the other calls to merge with it, then press Merge.'); return; }
    if (a === 'unmerge') { await api('/api/unmerge?id=' + encodeURIComponent(key)); dayCache.clear(); }
    if (a === 'export') {
      const group = chObj ? chObj.calls : calls.filter((c) => kind === 'call' ? c.id === key : (c.srvKey || srvKey(c)) === key);
      return chooseFormat({ label, calls: group });
    }
    if (a === 'archive') {
      await each((k2) => `/api/archive?kind=${kind}&key=${k2}&on=1`);
      toastUndo(`${what[0].toUpperCase() + what.slice(1)} archived`, async () => {
        await each((k2) => `/api/archive?kind=${kind}&key=${k2}&on=0`);
        await loadCalls(); await showCall(true);
      });
    }
    if (a === 'unarchive') {
      for (const ak of new Set(chObj ? chObj.calls.map((c) => c.archived).filter(Boolean) : [arch])) {
        const [k2, ...rest] = ak.split(':'); await api(`/api/archive?kind=${k2}&key=${encodeURIComponent(rest.join(':'))}&on=0`);
      }
    }
    if (a === 'delete') {
      const n = (await each((k2) => `/api/delete?kind=${kind}&key=${k2}&dry=1`)).reduce((t, x) => ({ calls: t.calls + (x.calls || 0), lines: t.lines + (x.lines || 0) }), { calls: 0, lines: 0 });
      const ok = await confirmBox(`Delete ${what} “${label}”?`,
        `This removes ${n.calls} ${n.calls === 1 ? 'call' : 'calls'} (${n.lines.toLocaleString()} lines) from your transcripts and stats.`,
        syncView?.peers?.length
          ? `They are deleted on ${syncView.peers.map((p) => p.name).join(' and ')} too, at the next sync. Each computer keeps removed lines in its transcripts/.trash folder.`
          : 'Removed lines go to the transcripts/.trash folder, so you can still get them back by hand.', 'Delete');
      if (!ok) return;
      await each((k2) => `/api/delete?kind=${kind}&key=${k2}`);
      dayCache.clear();
    }
    await loadCalls(); await showCall(true);
  });
});
document.addEventListener('click', (e) => { if (!$('#ctx').contains(e.target)) closeCtx(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCtx(); });
addEventListener('blur', closeCtx);
// a toast with an Undo button (stays a little longer than a plain one)

let pluginList = [];
async function loadPlugins() {
  pluginList = await fetch('/api/plugins').then((r) => r.json()).catch(() => []);
  for (const pl of pluginList.filter((x) => x.enabled)) {
    try {
      if (pl.style) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `/plugins/${pl.id}/${pl.style}`; document.head.appendChild(l); }
      const mod = await import(`/plugins/${pl.id}/${pl.main}?v=${encodeURIComponent(pl.version || '')}`);
      if (typeof mod.default === 'function') await mod.default(earshot);
      pl.loaded = true;
    } catch (e) { pl.error = String(e.message || e).slice(0, 200); console.error('[plugin]', pl.id, e); }
  }

// A strong random password: 20 characters, upper and lower case, digits and symbols, no look-alikes (0/O, 1/l/I).
function securePassword(len = 20) {
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '!@#$%^&*-_=+?'];
  const all = sets.join('');
  const pick = (chars) => { const lim = 256 - (256 % chars.length), b = new Uint8Array(1); do crypto.getRandomValues(b); while (b[0] >= lim); return chars[b[0] % chars.length]; };
  const out = sets.map(pick);                                   // at least one of each kind
  while (out.length < len) out.push(pick(all));
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor((crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32) * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }
}

function trendTiles(p, method, W = 220) {

    const x = (i) => p.reads.length < 2 ? (L + W - R) / 2 : L + PAD + (W - L - R - 2 * PAD) * i / (p.reads.length - 1);
    const y = (v) => T + (H - T - B) * (hi - v) / (hi - lo);

    const cur = pts.filter((q) => q.r.method === method);
    if (cur.length > 1) g += `<path d="${cur.map((q, j) => `${j ? 'L' : 'M'}${x(q.i).toFixed(1)},${y(q.v).toFixed(1)}`).join('')}" class="sl"/>`;

// "How reads work": the steps, the codebook and how often the two coding passes agreed on each code
function howHtml(S) {

  return `<div class="how">
    <ol class="how-steps">
      <li><b>Their lines are gathered, without names.</b> Up to about 20,000 of their most recent words across all calls, with up to two lines others said just before and after each one, so jokes and replies read in context. The person becomes P and everyone else a letter, so no name, server or channel can sway the coding.</li>
      <li><b>Claude tags lines, it doesn't score people.</b> In pieces of ${S.rules?.chunk || 120} lines, each line gets codes from the fixed codebook below, or none. Most lines get none.</li>
      <li><b>Two independent passes.</b> Every piece is tagged ${S.rules?.coders || 2} times; only tags every pass agrees on count. How often they agreed is shown with each read.</li>
      <li><b>Fixed rules make the scores.</b> Tags become rates per 100 turns (lines said back to back count as one), counting only turns that could show something (three words or more, or tagged, and not garbled), with 100 extra turns added so thin evidence leans to the middle. Signals use fixed cut-offs, need at least 1, 2 or 3 agreed lines for a 1, 2 or 3, and aren't rated until someone has 100 counted turns. Big Five scores come from positive minus negative lines; a trait with fewer than 3 lines of evidence is "not rated", and a 1 or 5 needs 8. How much someone talks is shown but never changes a score.</li>
      <li><b>A new read every ${S.rules?.every || 400} lines.</b> The first comes at ${S.rules?.first || 40} lines. Every read is kept, so you can see change over time on each person's page in People.</li>

    <table class="stable cbt"><tr><th>Code</th><th>Counts when</th><th>Doesn't count</th><th>Feeds</th><th title="How often both coding passes agreed on this code, over all current reads">Agreed</th></tr>
      ${Object.entries(cb).map(([k, v]) => { const a = S.agreeByCode?.[k]; return `<tr><td><code>${esc(k)}</code></td><td>${esc(v.yes)}</td><td>${esc(v.no)}</td><td>${eff(v.effects)}</td><td title="${a ? `${a[0]} of ${a[1]} tags` : 'No tags yet'}">${!a || a[1] < 10 ? '–' : Math.round(100 * a[0] / a[1]) + '%'}</td></tr>`; }).join('')}</table>

// plain sentences about what stands out; each one names who and how much
function insFindings(I) {
  const ps = I.people, T = I.totals, out = [];
  if (!ps.length) return out;
  const top = (k, f = (p) => p[k] != null) => ps.filter(f).slice().sort((a, b) => b[k] - a[k]);
  const enough = (p) => p.lines >= 200;
  const s = top('share');
  if (s[0]) out.push(`${insWho(s[0].id, s[0].name)} does the most talking: ${s[0].share}% of all talking time${s[1] ? `, then ${insWho(s[1].id, s[1].name)} with ${s[1].share}%` : ''}.`);
  if (T.questions) out.push(`${iPct(T.answered, T.questions)}% of the ${nf(T.questions)} real questions got an answer${T.waitMedian != null ? `, usually within ${Math.max(1, Math.round(T.waitMedian))} seconds` : ''}.`);
  const ask = top('asked'), ans = top('answered');
  if (ask[0] && ask[0].asked) out.push(`${insWho(ask[0].id, ask[0].name)} asks the most questions (${nf(ask[0].asked)}), and ${ans[0] && ans[0].answered ? `${insWho(ans[0].id, ans[0].name)} answers the most (${nf(ans[0].answered)})` : 'nobody stands out for answering'}.`);
  const ign = ps.filter((p) => p.asked >= 30).sort((a, b) => a.askedAnswered / a.asked - b.askedAnswered / b.asked);
  if (ign.length >= 3) { const lo = ign[0], hi = ign[ign.length - 1]; out.push(`Questions from ${insWho(hi.id, hi.name)} get answered most often (${iPct(hi.askedAnswered, hi.asked)}%); questions from ${insWho(lo.id, lo.name)} least often (${iPct(lo.askedAnswered, lo.asked)}%).`); }
  const pr = I.pairs[0];
  if (pr) out.push(`${insWho(pr.a, pr.aName)} and ${insWho(pr.b, pr.bName)} go back and forth the most: ${nf(pr.ab + pr.ba)} replies between them.`);
  const ov = top('overRate', enough);
  if (ov.length >= 3) out.push(`${insWho(ov[0].id, ov[0].name)} cuts in most: ${ov[0].overRate}% of their lines start while someone else is still talking. ${insWho(ov[ov.length - 1].id, ov[ov.length - 1].name)} waits their turn most (${ov[ov.length - 1].overRate}%).`);
  const sw = top('swearRate', enough);
  if (sw[0] && T.swears) out.push(`${iPct(T.swears, T.words) >= 1 ? `${(100 * T.swears / T.words).toFixed(1)}% of all words are swears` : `${nf(T.swears)} swears in all`}. ${insWho(sw[0].id, sw[0].name)} swears most: ${sw[0].swearRate} per 100 lines.`);

  const va = top('variety', (p) => p.variety != null && enough(p));
  if (va.length >= 3) out.push(`${insWho(va[0].id, va[0].name)} uses the widest range of words (${va[0].variety} different words in every 100).`);
  const lt = top('wordsPerTurn', enough);
  if (lt[0]) out.push(`${insWho(lt[0].id, lt[0].name)} talks longest before letting someone else in: ${lt[0].wordsPerTurn} words a turn on average${lt.length > 2 ? `, against ${lt[lt.length - 1].wordsPerTurn} for ${insWho(lt[lt.length - 1].id, lt[lt.length - 1].name)}` : ''}.`);
  const pk = I.hours.indexOf(Math.max(...I.hours));

  if (I.longest && I.longest.words >= 40) out.push(`The longest stretch without a break: ${insWho(I.longest.who, I.longest.name)}, ${nf(I.longest.words)} words${I.longest.call ? ` · <button class="linkbtn" data-open="${esc(I.longest.call)}" data-t="${I.longest.t}" title="Open the transcript at this line">Read it</button>` : ''}.`);

}

function insBars(vals, labels, tips, H = 150) {
  const W = 640, L = 36, R = 6, T = 8, B = 22, n = vals.length, max = Math.max(1, ...vals);
  const step = (W - L - R) / n, bw = Math.max(2, Math.min(28, step - 2));

  const tick = nice(max), top = Math.ceil(max / tick) * tick, y = (v) => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += tick) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="sg"/><text x="${L - 6}" y="${y(v) + 3}" class="sy">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  vals.forEach((v, i) => {
    const x = L + i * step + (step - bw) / 2, h = Math.max(0, y(0) - y(v));
    if (v) g += `<path d="M${x},${y(0)}v${-Math.max(0, h - 3)}q0,-3 3,-3h${bw - 6}q3,0 3,3v${Math.max(0, h - 3)}z" class="ibar"/>`;
    g += `<rect x="${L + i * step}" y="${T}" width="${step}" height="${H - T - B}" class="hit" data-tip="${esc(tips[i])}"/>`;
    if (labels[i]) g += `<text x="${x + bw / 2}" y="${H - 6}" class="sx" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="ichart" role="img">${g}</svg>`;
}

function insWords(I) {
  if (!I.totals.lines) return `${insControls(I)}<div class="empty-box">Nothing was said in this span.</div>`;
  const max = Math.max(1, ...I.words.map((w) => w.n));
  const wbtn = (w, n) => `<button class="iword" data-q="${esc(w)}" title="Search every transcript for “${esc(w)}”">${esc(w)}<small>${nf(n)}</small></button>`;
  const bars = I.words.slice(0, 30).map((w) => `<button class="ibrow" data-q="${esc(w.w)}" title="Search every transcript for “${esc(w.w)}”"><span>${esc(w.w)}</span><i style="width:${(100 * w.n / max).toFixed(1)}%"></i><b>${nf(w.n)}</b></button>`).join('');
  const sw = I.swearWords;
  const sig = I.people.filter((p) => p.signature.length).slice(0, 20);
  return `${insControls(I)}
    <h2 class="sh2">Most used words <small>leaving out small words like "the", "yeah" and "like" · select one to search for it</small></h2><div class="ibars">${bars}</div>
    <h2 class="sh2">Common phrases <small>two words</small></h2><div class="iwords">${I.phrases.map((p) => wbtn(p.w, p.n)).join('')}</div>
    <h2 class="sh2">Common phrases <small>three words</small></h2><div class="iwords">${I.phrases3.map((p) => wbtn(p.w, p.n)).join('')}</div>
    ${I.rising.length ? `<h2 class="sh2">New and rising <small>said far more in the last 24 hours than before</small></h2>
      <table class="stable"><tr><th>Word</th><th>Last 24 hours</th><th>Before</th><th title="How much more often, allowing for how much was said in each span">More often</th></tr>${I.rising.map((r) => `<tr><td>${wbtn(r.w, r.now)}</td><td>${nf(r.now)}</td><td>${nf(r.before)}</td><td>${r.before ? r.x + '×' : 'new'}</td></tr>`).join('')}</table>`
      : I.period === '24h' ? '' : '<h2 class="sh2">New and rising</h2><div class="hint">Nothing stands out in the last 24 hours compared with before.</div>'}
    <h2 class="sh2">Each person's own words <small>words and phrases they use far more than everyone else</small></h2>
    <table class="stable isig"><tr><th>Person</th><th>Their words</th><th>Their phrases</th></tr>${sig.map((p) => `<tr><td>${insWho(p.id, p.name)}</td><td>${p.signature.map((s) => `<span class="iw" title="${nf(s.n)} times">${esc(s.w)}</span>`).join(' ')}</td><td>${p.phrases.map((s) => `<span class="iw" title="${nf(s.n)} times">${esc(s.g)}</span>`).join(' ') || '<span class="un">–</span>'}</td></tr>`).join('')}</table>
    ${sw.length ? `<h2 class="sh2">Swearing <small>${nf(I.totals.swears)} in all, ${(100 * I.totals.swears / Math.max(1, I.totals.words)).toFixed(1)}% of words</small></h2><div class="iwords">${sw.map((w) => wbtn(w.w, w.n)).join('')}</div>` : ''}`;
}

function insTalk(I) {
  if (!I.people.length) return `${insControls(I)}<div class="empty-box">Nobody has said 30 lines in this span yet.</div>`;
  const cols = [
    ['name', 'Person', 'Who it is', (p) => insWho(p.id, p.name)],
    ['share', 'Talk', 'Share of all talking time', (p) => p.share + '%'],
    ['wpl', 'Words a line', 'Average words in each line', (p) => p.wpl],
    ['wordsPerTurn', 'Words a turn', 'Words said before someone else speaks (lines back to back count as one turn)', (p) => p.wordsPerTurn],
    ['qRate', 'Questions', 'Lines that end in a question mark, per 100 lines', (p) => p.qRate],
    ['asked', 'Answered', 'Of their real questions, how many someone answered', (p) => p.asked ? `${iPct(p.askedAnswered, p.asked)}% <small class="un">of ${nf(p.asked)}</small>` : '–', (p) => p.asked ? p.askedAnswered / p.asked : -1],
    ['answered', 'Answers', 'Questions from others they answered', (p) => nf(p.answered)],
    ['overRate', 'Cuts in', 'Lines that start while someone else is still talking, per 100 lines', (p) => p.overRate],
    ['swearRate', 'Swears', 'Swear words per 100 lines', (p) => p.swearRate],
    ['we', '"We"', 'Share of their "I" and "we" words that are "we": higher talks more as the group', (p) => p.selfShare == null ? '–' : (100 - p.selfShare) + '%', (p) => p.selfShare == null ? -1 : 100 - p.selfShare],
    ['variety', 'Variety', 'Different words in every 100 they say (needs 500 words)', (p) => p.variety ?? '–', (p) => p.variety ?? -1],
    ['peakHour', 'Usually on', 'The hour they say the most in', (p) => esc(hourName(p.peakHour)), (p) => (p.peakHour + 18) % 24],
    ['reply', 'Replies most to', 'Whose lines they reply to most often', (p) => p.topReply ? `${insWho(p.topReply.id, p.topReply.name)} <small class="un">${nf(p.topReply.n)}</small>` : '–', (p) => p.topReply?.n || 0],
  ];
  const col = cols.find((c) => c[0] === insSort.k) || cols[1];
  const val = col[4] || ((p) => col[0] === 'name' ? insName(p.id, p.name).toLowerCase() : p[col[0]]);
  const rows = I.people.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * insSort.dir; });
  const pmax = Math.max(1, ...I.pairs.map((p) => p.ab + p.ba));
  return `${insControls(I)}
    <p class="hint" style="margin-top:0">The 40 people who talk most, each with at least 30 lines in this span. Select a heading to sort by it; hover a heading to see what it counts.</p>
    <div class="itable-wrap"><table class="stable itable"><tr>${cols.map(([k, l, d]) => `<th title="${esc(d)}"><button class="isort${k === insSort.k ? ' on' : ''}" data-sort="${k}">${esc(l)}${k === insSort.k ? (insSort.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>`).join('')}</tr>
      ${rows.map((p) => `<tr>${cols.map((c) => `<td>${c[3](p)}</td>`).join('')}</tr>`).join('')}</table></div>
    <h2 class="sh2">Who replies to whom <small>a line said within 3 seconds of someone else's counts as a reply</small></h2>
    <div class="ipairs">${I.pairs.map((p) => `<div class="ipair"><span>${insWho(p.a, p.aName)} <span class="un">and</span> ${insWho(p.b, p.bName)}</span><i><em style="width:${(100 * p.ab / pmax).toFixed(1)}%" data-tip="${esc(`${insName(p.b, p.bName)} replying to ${insName(p.a, p.aName)}: ${p.ab}`)}"></em><em class="b" style="width:${(100 * p.ba / pmax).toFixed(1)}%" data-tip="${esc(`${insName(p.a, p.aName)} replying to ${insName(p.b, p.bName)}: ${p.ba}`)}"></em></i><b>${nf(p.ab + p.ba)}</b></div>`).join('')}</div>
    <p class="hint">The two shades split each pair by who was replying. These count timing only: a quick line after someone else's is usually, not always, a reply.</p>`;
}

function wireInsights(box, repaint) {
  box.querySelectorAll('[data-i]').forEach((s) => s.addEventListener('change', () => { insOpts[s.dataset.i] = s.value; repaint(); }));
  box.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { showView('calls'); const q = $('#hq'); q.value = b.dataset.q; q.dispatchEvent(new Event('input')); q.focus(); });
  box.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => { showView('calls'); openCall(b.dataset.open, +b.dataset.t); });
  box.querySelectorAll('[data-sort]').forEach((b) => b.onclick = () => { const k = b.dataset.sort; insSort = { k, dir: insSort.k === k ? -insSort.dir : (k === 'name' ? 1 : -1) }; repaint(); });
}
async function renderStudyPage() {
  const box = $('#view-study');

  const reads = serverSettings?.personality !== false;          // the read tabs only while personality reads are on
  const S = reads ? await getStudy(true) : null;

  if (curView !== 'study') return;

  function groupTab() {
    const [lo, hi] = traitScale(studyGroupTrait);
    const pts = people.map((p) => { const r = latestRead(p, S.method); return { p, r, v: readScore(r, studyGroupTrait) }; }).filter((q) => q.v != null && q.p.lines > 0);
    if (!pts.length) return '<div class="hint">No reads yet.</div>';

    const y = (v) => T + (H - T - B) * (hi - v) / (hi - lo);
    let g = '';
    for (let v = lo; v <= hi; v++) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="sg"/><text x="${L - 8}" y="${y(v) + 4}" class="sy">${v}</text>`;
    for (const t of [25, 50, 100, 200, 500, 1000, 2000, 5000]) if (Math.log10(t) >= x0 - 0.01 && Math.log10(t) <= x1 + 0.01) g += `<text x="${x(t)}" y="${H - 14}" class="sx" text-anchor="middle">${t >= 1000 ? t / 1000 + 'k' : t}</text>`;
    g += `<text x="${(L + W - R) / 2}" y="${H - 1}" class="sx" text-anchor="middle">lines spoken (log scale)</text>`;
    const seen = new Map();
    for (const q of pts) {
      const k = q.v, j = seen.get(k) || 0; seen.set(k, j + 1);
      const jit = ((j % 5) - 2) * 4;                                    // spread people with the same score a little
      const old = q.r.method !== S.method;
      g += `<circle cx="${x(q.p.lines)}" cy="${y(q.v) + jit}" r="5" class="${old ? 'sd ring old' : 'sd ring'}"/><circle cx="${x(q.p.lines)}" cy="${y(q.v) + jit}" r="11" class="hit" data-tip="${esc(`${studyName(q.p)} · ${traitName(studyGroupTrait)} ${q.v}/${hi} · ${q.p.lines.toLocaleString()} lines${old ? ' · other method' : ''}`)}"/>`;
    }
    const sorted = pts.slice().sort((a, b) => (b.r.method === S.method) - (a.r.method === S.method) || b.v - a.v || b.p.lines - a.p.lines);
    const curPts = pts.filter((q) => q.r.method === S.method);       // r only from reads made the same way
    const r = pearson(curPts.map((q) => Math.log10(q.p.lines)), curPts.map((q) => q.v));
    return `<div class="srowc"><select data-s="trait" aria-label="Trait">${[...TRAITS_B5, ...TRAITS_SIG].map(([k, l]) => `<option value="${k}" ${k === studyGroupTrait ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="hint">Each dot is a person's latest read; hollow dots are older reads, shown but not compared. ${curPts.length < 10 ? `Only ${curPts.length} ${curPts.length === 1 ? 'person has' : 'people have'} a current read: too few to say whether talking more goes with ${esc(traitName(studyGroupTrait).toLowerCase())}.` : r == null ? '' : `Lines spoken and ${esc(traitName(studyGroupTrait).toLowerCase())}: r = ${r.toFixed(2)} across ${curPts.length} people.`}</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="sscatter" role="img" aria-label="${esc(traitName(studyGroupTrait))} against lines spoken">${g}</svg>
      <table class="stable"><tr><th>Person</th><th>${esc(traitName(studyGroupTrait))}</th><th>Lines</th><th>Read</th></tr>${sorted.map((q) => `<tr><td><button class="linkbtn" data-person="${esc(q.p.id)}" title="Open ${esc(studyName(q.p))} in People">${esc(studyName(q.p))}</button></td><td>${q.v}/${hi}</td><td>${q.p.lines.toLocaleString()}</td><td>${esc(fmtDay(q.r.at))}${q.r.method !== S.method ? ' <span class="tag-old">older</span>' : ''}</td></tr>`).join('')}</table>`;
  }

  // Check the reads: do scores follow things that aren't behaviour (fairness), do they agree
  // with Big Five tests people took, and how often the two coding passes agreed per code.
  function fairTable() {
    const rows = people.map((p) => ({ p, r: [...p.reads].reverse().find((x) => x.method === S.method) })).filter((z) => z.r);
    if (rows.length < 10) return `<div class="empty-box">This needs at least 10 people with a read made the current way (${rows.length} so far). With fewer, the numbers swing too much to mean anything.</div>`;
    const factors = [
      ['Lines spoken', (z) => Math.log10(Math.max(1, z.p.lines)), 'log of how many lines they\'ve said'],
      ['Words per line', (z) => z.p.words / Math.max(1, z.p.lines), 'people who talk in short bursts vs long sentences'],
      ['Garbled lines', (z) => (z.r.garbled || 0) / Math.max(1, (z.r.n || 0) + (z.r.garbled || 0)), 'how badly the transcript caught them (accent, mic, noise)'],
      ['Coder agreement', (z) => z.r.agreement ?? null, 'how often the two coding passes agreed on them'],
    ];
    const traits = [...TRAITS_B5, ...TRAITS_SIG];
    const cell = (rr, n, why) => {
      if (rr == null) return `<td class="fz" title="${esc(why)}">–</td>`;
      const flag = Math.abs(rr) >= 0.5 && n >= 8;
      return `<td class="fz${flag ? ' flag' : ''}" title="r = ${rr.toFixed(2)} across ${n} people${flag ? ': a strong link; worth checking' : ''}">${rr >= 0 ? '+' : '−'}${Math.abs(rr).toFixed(2)}${flag ? ' ⚑' : ''}</td>`;
    };
    let flagged = 0;
    const body = traits.map(([k, label]) => `<tr><td>${esc(label)}</td>${factors.map(([, f]) => {
      const zz = rows.filter((z) => readScore(z.r, k) != null && f(z) != null);
      const xs = zz.map(f), ys = zz.map((z) => readScore(z.r, k));
      const rr = pearson(xs, ys);
      if (rr != null && Math.abs(rr) >= 0.5 && zz.length >= 8) flagged++;
      const why = zz.length < 3 ? 'Fewer than 3 people have this' : new Set(xs).size < 2 ? 'Everyone has the same value here, so there is nothing to compare' : new Set(ys).size < 2 ? 'Everyone got the same score on this' : '';
      return cell(rr, zz.length, why);
    }).join('')}</tr>`).join('');
    return `<p class="hint" style="margin-top:0">Each number is how strongly a score moves with something that isn't behaviour, across the ${rows.length} people with a current read (r from −1 to +1; near 0 is what you want). ⚑ marks a strong link (0.5 or more, with at least 8 people). A link isn't proof of bias: people who talk more may really be more outgoing. But a strong link with garbled lines or line length would point at the method, not the person.</p>
      <table class="stable ftable"><tr><th>Score</th>${factors.map(([l, , d]) => `<th title="${esc(d)}">${esc(l)}</th>`).join('')}</tr>${body}</table>
      <p class="hint">– means it can't be worked out yet: hover it to see why.${flagged ? ` ${flagged} strong link${flagged === 1 ? '' : 's'} right now. With few people these numbers move a lot; check again as more reads come in.` : ''}</p>`;
  }
  function testTable() {
    const both = people.map((q) => ({ q, r: [...q.reads].reverse().find((x) => x.method === S.method), t: S.tests[q.id] })).filter((z) => z.r && z.t);
    const nTests = Object.keys(S.tests || {}).length;
    const corr = TRAITS_B5.map(([k, label]) => {
      const zz = both.filter((z) => z.r.big5[k] != null);
      const rr = pearson(zz.map((z) => z.r.big5[k]), zz.map((z) => z.t[k]));
      return `<tr><td>${esc(label)}</td><td>${zz.length}</td><td>${rr == null ? '–' : rr.toFixed(2)}</td></tr>`;
    }).join('');
    return `${!nTests ? '<div class="empty-box">Nobody has test scores yet. To add some, open a person in People and choose Add their test scores.</div>' : ''}
      <table class="stable"><tr><th>Trait</th><th>People</th><th title="r near 1 is strong agreement; with fewer than 3 people it shows –">r</th></tr>${corr}</table>
      <p class="hint">Only people with both a test and a read made the current way count. r near 1 means the read and the test agree; fewer than 3 people shows –.</p>`;
  }
  function codeTable() {
    const cb = S.codebook || {}, a = S.agreeByCode || {};
    const rows = Object.keys(cb).map((k) => ({ k, a: a[k] })).sort((x, y) => (y.a?.[1] || 0) - (x.a?.[1] || 0));
    if (!rows.some((z) => z.a && z.a[1])) return '<div class="hint">No tags yet.</div>';
    return `<table class="stable"><tr><th>Code</th><th>Tags</th><th title="Tags both coding passes gave, out of tags either gave">Both passes agreed</th></tr>${rows.map(({ k, a: x }) => `<tr><td><code>${esc(k)}</code></td><td>${x ? x[1].toLocaleString() : 0}</td><td title="${x ? `${x[0].toLocaleString()} of ${x[1].toLocaleString()} tags` : 'No tags yet'}">${!x || x[1] < 10 ? '–' : Math.round(100 * x[0] / x[1]) + '%'}</td></tr>`).join('')}</table>
      <p class="hint">Over everyone's latest current read. A code with fewer than 10 tags shows –.</p>`;
  }
  function fairHow() {
    return `<details class="how-more"><summary>What the method does about bias</summary>
      <ul class="how-steps">
        <li><b>No names.</b> The coders see the person as P and everyone else as letters, with names in what was said swapped too, and no server or channel names. The summary is written about P; the name goes back in afterwards.</li>
        <li><b>Fair counts.</b> Rates count only lines that could show something (three words or more, or tagged). One-word replies and lines the transcript garbled don't water down anyone's scores.</li>
        <li><b>Same standard for everyone.</b> The coders are told to judge everyone by the same standard however they speak or however well they were transcribed, and to tag unclear lines GARBLED instead of guessing.</li>
        <li><b>Balanced codes.</b> Each Big Five trait has codes that raise it and codes that lower it, so no trait leans one way by design.</li>
        <li><b>Two passes.</b> Only tags both coding passes agree on count, and each read shows how often they agreed.</li>
        <li><b>Turns, not fragments.</b> Lines said back to back count as one turn, so people whose speech gets cut into many short pieces don't count more often.</li>
        <li><b>Thin evidence leans to the middle.</b> Rates are taken over the lines plus 100 extra, so a handful of lines can't swing someone to an extreme.</li>
        <li><b>Talking a lot isn't a trait.</b> How much someone talks is shown but never changes a score.</li>
        <li><b>No evidence isn't "none".</b> Signals aren't rated until someone has 100 counted turns, so people who've said less don't look less warm or less anything.</li>
      </ul></details>`;
  }
  const checkTab = () => `<h2 class="sh2">Fairness</h2>${fairTable()}${fairHow()}
    <h2 class="sh2">Reads against Big Five tests</h2>${testTable()}
    <h2 class="sh2">Agreement per code</h2>${codeTable()}
    <p class="hint"><button class="linkbtn" data-a="how">How reads work</button>: the steps, the full codebook and the rules.</p>`;

  function paint() {
    const tabs = [['overview', 'Overview', 'What stands out and when people talk'], ['words', 'Word patterns', 'Words, phrases and what\'s new'],
      ['talk', 'How people talk', 'Each person\'s style and who replies to whom'],
      ...(S ? [['group', 'Compare people', 'Everyone on one personality trait'], ['check', 'Check the reads', 'Fairness, tests and coder agreement']] : [])];
    if (!tabs.some(([k]) => k === studyTab)) studyTab = 'overview';
    const insTab = ['overview', 'words', 'talk'].includes(studyTab);
    const insHtml = (I) => !I ? '<p>The server isn\'t running.</p>' : studyTab === 'words' ? insWords(I) : studyTab === 'talk' ? insTalk(I) : insOverview(I);
    const ready = insTab && insCache && insCache.key === insOpts.srv + '|' + insOpts.period && Date.now() - insCache.at < 60000 ? insCache.I : null;
    const body = insTab ? `<div class="ins-body">${ready ? insHtml(ready) : '<div class="pwait"><span class="s"></span>Going through every line…</div>'}</div>` : studyTab === 'check' ? checkTab() : groupTab();
    const cur = tabs.find(([k]) => k === studyTab);
    box.innerHTML = `<div class="page sub-page study-page">
      <nav class="subnav" aria-label="Study"><div class="subnav-h">Study</div>${tabs.map(([k, l, d]) => `<button data-tab="${k}" class="${k === studyTab ? 'on' : ''}" aria-current="${k === studyTab ? 'page' : 'false'}"><b>${l}</b><small>${d}</small></button>`).join('')}</nav>
      <div class="sub-body"><div class="page-h"><h1>${cur[1]}</h1></div>${body}</div></div>`;
    box.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { studyTab = b.dataset.tab; paint(); box.querySelector(`[data-tab="${studyTab}"]`)?.focus(); });
    box.querySelector('[data-s="trait"]')?.addEventListener('change', (e) => { studyGroupTrait = e.target.value; paint(); box.querySelector('[data-s="trait"]')?.focus(); });
    box.querySelectorAll('[data-person]').forEach((b) => b.onclick = () => openPeople(b.dataset.person));
    box.querySelector('[data-a="how"]')?.addEventListener('click', () => openHowReads());
    wireTips(box);
    if (insTab) {
      const el = box.querySelector('.ins-body');
      if (ready) wireInsights(el, paint);
      else {
        const my = ++paintSeq;
        getInsights().then((I) => {
          if (my !== paintSeq || curView !== 'study' || !el.isConnected) return;
          el.innerHTML = insHtml(I);
          el.querySelectorAll('[data-person]').forEach((b) => b.onclick = () => openPeople(b.dataset.person));

  }

function personaHtml(text) {
  // tiny, safe markdown: escape first, then **bold** and "- " list items
  const out = []; let list = false;
  for (const raw of esc(text).split('\n')) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').trim();
    if (/^[-•*] /.test(line)) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + line.slice(2) + '</li>'); continue; }
    if (list) { out.push('</ul>'); list = false; }
    if (line) out.push('<p>' + line + '</p>');
  }
  if (list) out.push('</ul>');
  return out.join('');
}
// The personality read as a little report: meters for the signals and the Big

const SIG_COLOR = { 0: 'var(--text-muted)', 1: '#e3b341', 2: '#e0813c', 3: '#e5565b' };   // stronger flag = warmer
function meter(score, max, fill) {
  const pct = Math.max(0, Math.min(1, score / max)) * 100;
  const avg = max === 5 ? '<i class="mid"></i>' : '';   // Big Five: a mark at the average (3)
  return `<span class="meter">${avg}<b style="width:${pct.toFixed(0)}%;background:${fill}"></b></span>`;
}
function personaGraphic(d) {
