<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earshot</title>
<link rel="icon" href="/logo.png">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e3e2de;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #686762;
  --accent: #2a78d6; --accent-fill: #2672cf; --good: #008300; --warn: #c98500; --bad: #c93534;
  --accent-text: #1f63b8; --bad-fill: #c93534; --border-strong: #8e8d87; --float-edge: var(--border);   /* text and fills that pass 4.5:1, control edges that pass 3:1 */
  --grid: #e9e8e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  /* people 9-24: picked to stay apart from the first 8 and each other (OKLab distance) and readable on the surface */
  --s9:#00515e; --s10:#721872; --s11:#764002; --s12:#7b5c82; --s13:#918436; --s14:#0bafda; --s15:#155700; --s16:#a93ca8;
  --s17:#c16ae2; --s18:#9084b2; --s19:#397d87; --s20:#9aa900; --s21:#c4917b; --s22:#a35b47; --s23:#5b6637; --s24:#4327a7;
  --fb-l: .56; --fb-dl: -.08;   /* lightness (and its step) of the generated colours for person 25 and up */
  --other:#a3a29c;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --scrim: rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface-1: #1a1a19; --surface-2: #222221; --border: #2c2c2a;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8d8c85;
    --accent: #3987e5; --accent-fill: #2563c4; --good: #0ca30c; --warn: #c98500; --bad: #e66767;
  --accent-text: #74abed; --bad-fill: #c23b3b; --border-strong: #6a6964; --float-edge: #45443f;
    --grid: #262624;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --other:#6b6a65;
    --s9:#97dbe8; --s10:#fb9df8; --s11:#ffbe8a; --s12:#84648b; --s13:#7f7221; --s14:#25b8e4; --s15:#83c575; --s16:#db6dd9;
    --s17:#a44dc4; --s18:#b5a9d9; --s19:#397d87; --s20:#c9da51; --s21:#ce9a84; --s22:#a35b47; --s23:#8f9c6b; --s24:#7162e4;
    --fb-l: .74; --fb-dl: -.12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --scrim: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface-1: #1a1a19; --surface-2: #222221; --border: #2c2c2a;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8d8c85;
  --accent: #3987e5; --accent-fill: #2563c4; --good: #0ca30c; --warn: #c98500; --bad: #e66767;
  --accent-text: #74abed; --bad-fill: #c23b3b; --border-strong: #6a6964; --float-edge: #45443f;
  --grid: #262624;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --other:#6b6a65;
  --s9:#97dbe8; --s10:#fb9df8; --s11:#ffbe8a; --s12:#84648b; --s13:#7f7221; --s14:#25b8e4; --s15:#83c575; --s16:#db6dd9;
  --s17:#a44dc4; --s18:#b5a9d9; --s19:#397d87; --s20:#c9da51; --s21:#ce9a84; --s22:#a35b47; --s23:#8f9c6b; --s24:#7162e4;
  --fb-l: .74; --fb-dl: -.12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --scrim: rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.shell { display: grid; grid-template-columns: var(--rail) 270px minmax(0, 1fr); height: 100vh; overflow: hidden; }
.shell.collapsed { grid-template-columns: var(--rail) 0 minmax(0, 1fr); }
.shell.collapsed .side { visibility: hidden; }
.side { border-right: 1px solid var(--border); background: var(--surface-1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side .top { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
.side .top .row { display: flex; align-items: center; gap: 8px; }
.side .top h1 { font-size: 13px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.side .top input { width: 100%; }
.calls { overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; padding: 6px 8px 14px; }
.srv { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; color: var(--text-primary); background: transparent; border: 0;
  padding: 10px 8px 6px; cursor: pointer; text-align: left; border-radius: 8px; }
.srv:hover { background: var(--surface-2); }
.srv .ic { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none;
  background: linear-gradient(135deg, #5865f2, #3987e5); }
.srv .ic.none { background: var(--surface-2); color: var(--text-secondary); }
.srv .nm { font-weight: 650; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.srv .ct, .chn .ct { margin-left: auto; color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chev { width: 10px; color: var(--text-muted); transition: transform .15s; flex: none; font-size: 10px; }
.closed > .chev, .closed .chev { transform: rotate(-90deg); }
.chn { display: flex; align-items: center; gap: 6px; width: 100%; font: inherit; color: var(--text-secondary); background: transparent; border: 0;
  padding: 5px 8px 5px 18px; cursor: pointer; text-align: left; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
.chn:hover { background: var(--surface-2); color: var(--text-primary); }
.chn svg { width: 14px; height: 14px; flex: none; color: var(--text-muted); }
.chn .live { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
/* Voice now: who is in the server's voice channels, from Discord's own member list */
.chn.vnow-h { color: var(--text-muted); font-size: 11.5px; letter-spacing: .02em; }
.chn.vnow-h .cn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chn.vnow-h .ct { white-space: nowrap; }
.vnow { margin: 0 0 6px 18px; display: grid; gap: 2px; }
.vnow.stale { opacity: .7; }
.vnote { font-size: 11.5px; color: var(--text-muted); padding: 2px 8px 4px; }
.vch { padding: 4px 8px 5px; border-radius: 8px; min-width: 0; }
.vt { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); background: none; border: 0; padding: 0; text-align: left; }
button.vt { cursor: pointer; border-radius: 6px; }
button.vt:hover { color: var(--text-primary); }
.vt svg { width: 13px; height: 13px; flex: none; color: var(--text-muted); }
.vt .vn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.vt .vc { flex: none; color: var(--text-muted); font-weight: 400; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vt .live { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
.vp { display: flex; flex-wrap: wrap; gap: 1px 8px; padding: 2px 0 0 19px; font-size: 12px; color: var(--text-muted); min-width: 0; }
.vpn { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
button.vpn, .vmore { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 4px; text-align: left; }
button.vpn { color: var(--text-secondary); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 2px; }
button.vpn:hover { color: var(--text-primary); text-decoration-color: currentColor; }
.vmore { color: var(--accent-text); white-space: nowrap; }
.vmore:hover { text-decoration: underline; }
.vmore.chs { padding: 3px 8px; }
/* People detail: time in voice */
.pd-voice { padding: 12px 0 14px; border-bottom: 1px solid var(--border); }
.pd-voice .vsum { font-size: 13px; color: var(--text-secondary); margin: 6px 0 0; }
.pd-voice .vsum b { color: var(--text-primary); font-weight: 600; }
.pd-voice .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 24px; }
.pd-voice ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; }
.pd-voice li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; min-width: 0; }
.pd-voice li .n { flex: 1 1 9em; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-primary); }
.pd-voice li button.n { font: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--accent-text); }
.pd-voice li button.n:hover { text-decoration: underline; }
.pd-voice li .k { flex: none; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
.pd-voice li .rec { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; color: var(--text-secondary); }
.pd-voice .hint { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
.calls .call { margin-left: 18px; width: calc(100% - 18px); }
.ctx { position: fixed; z-index: 37; min-width: 190px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.28); padding: 5px; display: none; }
.ctx button { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text-primary); background: transparent; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.ctx button:hover, .ctx button:focus { background: var(--accent-fill); color: #fff; outline: none; }
.ctx button.danger { color: var(--bad); }
.ctx button.danger:hover, .ctx button.danger:focus { background: var(--bad); color: #fff; }
.ctx .sep { height: 1px; background: var(--border); margin: 4px 2px; }
.ctx .ttl { color: var(--text-muted); font-size: 11.5px; padding: 4px 10px 6px; max-width: 240px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: none; place-items: center; }
.modal { width: 380px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 18px; }
.modal h3 { margin: 0 0 8px; font-size: 15px; }
.modal p { margin: 0 0 6px; color: var(--text-secondary); font-size: 13px; line-height: 1.45; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modal button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; }
.modal .pxin { width: 100%; font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.modal .pxin:focus { border-color: var(--accent); }
.modal .pnote.bad { color: var(--bad); }
.modal button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.banner { display: none; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); font-size: 13px; }
.banner b { font-weight: 650; }
.banner .notes { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.banner button { font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; border: 0; background: var(--accent-fill); color: #fff; cursor: pointer; white-space: nowrap; }
.banner button.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.models { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.mrow.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 10%, var(--surface-1)); }
.mrow .n { font-weight: 650; font-size: 12.5px; }
.mrow .a { grid-column: 1; color: var(--text-secondary); font-size: 11.5px; }
.mrow .k { grid-column: 1; color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.mrow button { grid-row: 1 / span 3; grid-column: 2; align-self: center; font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.mrow button[disabled] { opacity: .6; cursor: default; }
.pop.wide { width: 380px; }
.fmt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.fmt button { text-align: left; padding: 10px 12px !important; }
.fmt button b { display: block; font-size: 13px; }
.fmt button span { color: var(--text-muted); font-size: 11.5px; }
.archhead { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; color: var(--text-muted); background: transparent; border: 0; border-top: 1px solid var(--border);
  margin-top: 10px; padding: 12px 8px 6px; cursor: pointer; text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.archived-tree { opacity: .75; }
.group { color: var(--text-muted); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 12px 8px 6px; }
.call { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; margin-bottom: 2px; }
.call:hover { background: var(--surface-2); }
.call.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface-1)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.call .t1 { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.call .t1 .ch { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.call .more { margin-left: auto; padding: 0 6px; border-radius: 6px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; opacity: 0; line-height: 18px; }
.call:hover .more, .call.on .more, .call:focus-visible .more { opacity: 1; }
.call .more:hover { background: var(--surface-2); color: var(--text-primary); }
@media (hover: none) { .call .more { opacity: 1; } }
.call .t1 svg { width: 14px; height: 14px; flex: none; color: var(--text-muted); }
.call .t2 { color: var(--text-muted); font-size: 11.5px; margin-top: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.call .t3 { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--text-secondary); font-size: 11.5px; }
.faces { display: flex; }
.faces span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--text-primary);
  background: var(--surface-2); border: 2px solid var(--surface-1); margin-left: -5px; }
.faces span:first-child { margin-left: 0; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: #fff; background: var(--bad); border-radius: 5px; padding: 1px 5px; margin-left: auto; }
.hit { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.hit:hover { background: var(--surface-2); }
.hit .m1 { color: var(--text-muted); font-size: 11.5px; }
.hit .m2 { font-size: 12.5px; margin-top: 2px; }
.hit .m0 { font-weight: 600; font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; align-items: center; }
.hit .m0 svg { width: 13px; height: 13px; flex: none; color: var(--text-muted); }
.hits-h { display: flex; align-items: baseline; gap: 8px; padding: 12px 8px 6px; }
.hits-h .group { padding: 0; }
.hits-h select { margin-left: auto; font: inherit; font-size: 11.5px; color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 1px 4px; max-width: 55%; }
/* a channel's log: where one call ends and the next starts */
.callsep { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; color: var(--text-muted); font-size: 11.5px; font-weight: 600; }
.callsep::before, .callsep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.earlier { display: block; margin: 4px auto 10px; }
.iconbtn { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); border-radius: 8px; height: 32px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn:hover { color: var(--text-primary); border-color: var(--text-muted); }
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; gap: 14px; padding: 16px 18px 18px; min-width: 0; }
.app > * { flex: none; }
.app > #layout { flex: 1 1 0; min-height: 0; }
.where { color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.where b { flex: 0 1 auto; min-width: 3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where span { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where svg { width: 15px; height: 15px; flex: none; color: var(--text-muted); }
.where span { white-space: nowrap; }
.where b { color: var(--text-primary); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the header wraps whenever it runs out of room: the call name keeps at least
   ~14em, and the status pills move to their own row (and wrap there) before
   anything is cut off */
header { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
header .where { flex: 1 1 14em; }
header .pills { flex: 0 1 auto; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; margin-left: auto; }
.pill { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; margin-right: 6px; }
.brand svg { width: 28px; height: 28px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--surface-1);
  border: 1px solid var(--border); color: var(--text-secondary); font-size: 12.5px; white-space: nowrap; }
.pill.discord-btn { background: #5865f2; color: #fff; border-color: transparent; font-weight: 600; }
.pill.discord-btn:hover { background: #4752c4; }
.pill[hidden] { display: none; }
#p-mute.on { background: #e6676722; border-color: #e6676766; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.pill.ok .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.pill.warn .dot { background: var(--warn); }
.pill.bad .dot { background: var(--bad); }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; }
select, input[type=search] {
  font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 10px; height: 32px;
}
input[type=search] { width: 170px; }
select:focus, input:focus { border-color: var(--accent); }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .label { color: var(--text-secondary); font-size: 12px; font-weight: 550; letter-spacing: .02em; }
.kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { color: var(--text-muted); font-size: 12px; }

.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
/* layout: columns of panels the user arranges (see applyLayout) */
.lcol { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.lcol > .card { flex: 0 0 auto; }
.lcol > .card.grow { flex: var(--grow, 1) 1 0; min-height: 0; overflow: hidden; }
body:not(.compact) .lcol > .card.grow:not([data-panel="transcript"]) { min-height: 190px; }
.card.grow > .body, .card.grow > .feed, .card.grow > .pers { flex: 1; min-height: 0; overflow: hidden; }
.card.grow.c-act > .body { display: flex; }
.card.grow #act { height: 100%; min-height: 60px; }
/* timeline: bottom-aligned when it fits, scrolls when there are more lanes than room (auto margin, so the top stays reachable) */
.card.grow.c-tl > .body { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.card.grow.c-tl #tl { flex: none; }
.c-tl .head { flex-wrap: wrap; row-gap: 6px; }
.c-tl .head .seg button { padding: 2px 7px; }
.c-tl:not(.grow) > .body { max-height: 460px; overflow-y: auto; overscroll-behavior: contain; }
/* talk time lists everyone: it scrolls inside its panel instead of cutting people off */
.card.grow.c-talk > .body { overflow-y: auto; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
.card.grow.c-talk .bars { padding-bottom: 12px; }   /* the last row clears the fade that hints there's more */
.c-talk:not(.grow) .bars { max-height: 330px; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.card.grow.c-words > .body { -webkit-mask-image: linear-gradient(#000 calc(100% - 18px), transparent); mask-image: linear-gradient(#000 calc(100% - 18px), transparent); }
.card.grow > .feed { overflow-y: auto; }
#panel-store { display: none; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; }
.card h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.card .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.card .head .meta { color: var(--text-muted); font-size: 12px; margin-left: auto; }
.col { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.col .card { flex: none; }
.body { padding: 4px 14px 14px; }

/* transcript */
.feed { overscroll-behavior: contain; overflow-y: auto; padding: 4px 6px 10px; flex: 1; min-height: 0; scroll-behavior: smooth; }
.line { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 6px 8px; border-radius: 10px; }
.line:hover { background: var(--surface-2); }
.line .time { white-space: nowrap; color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.line .who { font-weight: 650; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; }
.swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.line .text { color: var(--text-primary); }
.line.cont { padding-top: 0; }
.line.cont .time { visibility: hidden; }
.line.new { animation: flash 1.6s ease-out; }
/* lines that were not the person's own voice (a video, someone in their room) */
.line.bg .text { color: var(--text-muted); }
.line.bg .who { opacity: .6; }
.audio-lost { margin: 0 14px 10px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.45; color: var(--text-primary); background: color-mix(in srgb, #e5484d 14%, transparent); border: 1px solid color-mix(in srgb, #e5484d 45%, transparent); }
.audio-lost[hidden] { display: none; }
.call.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
.call .merged { color: var(--text-muted); }
.merge-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface-1); font-size: 12.5px; }
.merge-bar[hidden] { display: none; }
.merge-bar span { flex: 1; color: var(--text-secondary); min-width: 0; }
.merge-bar button { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.merge-bar button.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.merge-bar button:disabled { opacity: .5; cursor: default; }
.side .top .row { display: flex; align-items: center; gap: 8px; }
.people-btn { margin-left: auto; height: 26px; padding: 0 8px; font-size: 12px; }
.study-btn { margin-left: 4px; }
.modal.people { width: min(760px, calc(100vw - 32px)); }
/* study */
.stabs { display: flex; gap: 6px; margin: 0 0 12px; flex-wrap: wrap; }
.stabs button { font-size: 12.5px; padding: 5px 12px; border-radius: 999px; }
.stabs button.on { border-color: var(--accent); color: var(--text-primary); background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); }
.srowc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.srowc select, .sform select, .sform input { font: inherit; font-size: 12.5px; color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
.srowc .hint { margin: 0; flex: 1 1 240px; }
.sh2 { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; }
.sh2 small { font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stile { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 8px 10px 4px; min-width: 0; }
.sth { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.sth span { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sth b { font-size: 16px; font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }
:is(#view-study, #view-people) .stile .old { font-size: 11px; color: var(--text-muted); margin-top: -2px; }
.sth b small { font-size: 11px; font-weight: 500; color: var(--text-muted); }
:is(#view-study, #view-people) svg { width: 100%; height: auto; display: block; overflow: visible; }
:is(#view-study, #view-people) .sg { stroke: var(--border); stroke-width: 1; }
:is(#view-study, #view-people) .sy, :is(#view-study, #view-people) .sx { fill: var(--text-muted); font-size: 10px; }
:is(#view-study, #view-people) .sy { text-anchor: end; }
:is(#view-study, #view-people) .sl { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
:is(#view-study, #view-people) .sd { fill: var(--s1); stroke: var(--surface-2); stroke-width: 2; }
:is(#view-study, #view-people) .sd.old { fill: var(--surface-1); stroke: var(--s1); stroke-width: 1.5; }
:is(#view-study, #view-people) .sscatter .sd { stroke: var(--surface-1); }
:is(#view-study, #view-people) .sscatter .sd.old { stroke: var(--s1); }
:is(#view-study, #view-people) .hit { fill: transparent; cursor: default; }
:is(#view-study, #view-people) .sl2 { fill: var(--text-primary); font-size: 12px; }
:is(#view-study, #view-people) .sv { fill: var(--text-secondary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
:is(#view-study, #view-people) .sbar { stroke: var(--border); stroke-width: 2; }
:is(#view-study, #view-people) .sdot { stroke: var(--surface-1); stroke-width: 2; }
:is(#view-study, #view-people) .sdot.read, .slegend i.read { fill: var(--s1); background: var(--s1); }
:is(#view-study, #view-people) .sdot.test, .slegend i.test { fill: var(--s2); background: var(--s2); }
.slegend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 4px 0 2px; }
.slegend span { display: inline-flex; align-items: center; gap: 6px; }
.slegend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.stable { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.stable th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11.5px; border-bottom: 1px solid var(--border); padding: 5px 6px; }
.stable td { padding: 5px 6px; border-bottom: 1px solid var(--grid); color: var(--text-primary); font-variant-numeric: tabular-nums; }
.sform { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
.sform label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--text-secondary); }
.sform input { width: 100%; box-sizing: border-box; }
.stip { position: fixed; z-index: 60; display: none; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; }

.plist { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.prow .pn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.prow .pn small, .un { color: var(--text-muted); font-weight: 400; font-size: 12px; }
.prow .pn .aka { flex-basis: 100%; }
.prow .pc { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.plines { overflow-y: auto; }
.pday { font-size: 12px; font-weight: 650; color: var(--text-secondary); margin: 12px 0 4px; }
.pline .time { color: var(--text-muted); font-family: var(--mono); font-size: 11.5px; }
.pline i { color: var(--text-muted); font-style: normal; }
.spot-body { overflow-y: auto; min-height: 60px; font-size: 13px; line-height: 1.5; padding: 4px 14px 14px; }
.card.grow > .spot-body { flex: 1; min-height: 0; }
.spot-body .phead { margin-top: 10px; }
.bgtag { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 16%, transparent); } to { background: transparent; } }
/* questions and answers */
.feed { position: relative; }
.qa { font: inherit; font-size: 11px; line-height: 16px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; background: none; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
button.qa { cursor: pointer; }
button.qa:hover { background: var(--surface-2); color: var(--text-primary); }
.qa .swatch { width: 7px; height: 7px; }
.qa.none, .qa.wait { color: var(--text-muted); border-style: dashed; }
.line.qa-on { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.qa-link { position: absolute; left: 1px; width: 6px; border: 2px solid; border-right: 0; border-radius: 4px 0 0 4px; pointer-events: none; opacity: .8; }
.line.go { animation: flash 1.6s ease-out; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { color: var(--text-muted); text-align: center; padding: 40px 10px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }   /* steady, not pulsing: a pulse redraws the window ~100 times a second */
.jump { position: sticky; bottom: 8px; margin: 0 auto; display: none; background: var(--accent-fill); color: #fff; border: 0; border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; box-shadow: var(--shadow); }

/* speaking now */
.now { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 14px 14px; min-height: 30px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--border); font-size: 12.5px; color: var(--text-secondary); transition: all .2s; }
.chip .av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; }
.chip.talking { color: var(--text-primary); border-color: var(--text-muted); }
.chip.talking .av { box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 4px var(--good); }

/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 92px; align-items: center; gap: 10px; font-size: 12.5px; cursor: pointer; }
.bar-row .name { display: flex; align-items: center; gap: 7px; overflow-wrap: anywhere; line-height: 1.25; color: var(--text-primary); }   /* a long name wraps rather than being cut */
.bar-row .track { height: 10px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 4px; min-width: 2px; transition: width .4s; }
.bar-row .num { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.bar-row.dim { opacity: .35; }

svg text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
.axis line, .grid line { stroke: var(--grid); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--text-secondary); padding: 0 14px 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.legend span.dim { opacity: .35; }

.words { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
.word { display: grid; grid-template-columns: 1fr 40px; align-items: center; gap: 8px; font-size: 12.5px; }
.word .w { position: relative; padding: 3px 6px; border-radius: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.word .w i { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 6px; transform-origin: left; }
.word .w b { position: relative; font-weight: 550; }
.word .c { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: 320px; display: none; }
.tip .t { color: var(--text-muted); font-size: 11px; }
.seg { display: flex; gap: 2px; background: var(--surface-2); border-radius: 8px; padding: 2px; }
.seg button { font: inherit; font-size: 11.5px; border: 0; background: transparent; color: var(--text-secondary); padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface-1); color: var(--text-primary); box-shadow: var(--shadow); }
.pill { cursor: pointer; font: inherit; font-size: 12.5px; }
.pill:hover { border-color: var(--text-muted); }
.pop { position: fixed; z-index: 20; width: 300px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 12px 14px; display: none; font-size: 12.5px; }
.pop h3 { margin: 0 0 8px; font-size: 13px; }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; }
.pop dt { color: var(--text-muted); }
.pop dd { margin: 0; color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums; }
.pop .hint { color: var(--text-secondary); margin-top: 10px; line-height: 1.4; }
.pop .btns { display: flex; gap: 8px; margin-top: 12px; }
.pop button { flex: 1; font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; }
.pop button:hover { border-color: var(--text-muted); }
.pop button.danger { color: var(--bad); }
.res { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.res-pick { height: 22px !important; font-size: 11.5px; padding: 0 8px; margin-left: 4px; }
.share .res-pick { display: none; }
.res .m { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.res .m .l { color: var(--text-secondary); font-size: 11.5px; }
.res .m .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.res .m .s { color: var(--text-muted); font-size: 11px; line-height: 1.35; }
.res svg { display: block; width: 100%; height: 26px; margin-top: 4px; }
/* ---------- compact mode: every panel on one screen, nothing scrolls but the transcript */
body.compact .shell { grid-template-columns: var(--rail) 0 minmax(0, 1fr); }
body.compact .side { visibility: hidden; }
body.compact #toggle-compact { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
body.compact .app { gap: 10px; padding: 12px 14px 14px; }
body.compact .kpis { gap: 8px; }
body.compact .kpi { padding: 7px 12px; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
body.compact .kpi .label { font-size: 11.5px; white-space: nowrap; }
body.compact .kpi .value { font-size: 18px; margin: 0; white-space: nowrap; }
body.compact .card h2, body.compact .res .m .v, body.compact .res .m .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.compact .kpi .sub { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; font-size: 11px; }
body.compact .lcol { gap: 10px; overflow: hidden; }
body.compact .card .head { padding: 9px 12px 5px; }
body.compact .card .head .meta { font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
body.compact .body { padding: 2px 12px 10px; min-height: 0; }
body.compact .now { padding: 0 12px 10px; gap: 6px; max-height: 72px; overflow: hidden; }
body.compact .now.open { max-height: min(180px, 28vh); overflow-y: auto; overscroll-behavior: contain; }   /* "+N" opened: everyone, scrolling */
body.compact .chip { padding: 3px 8px 3px 4px; font-size: 12px; }
body.compact .res { gap: 6px; }
body.compact .res .m { padding: 6px 8px; }
body.compact .res .m .v { font-size: 15px; }
body.compact .res .m .s { display: none; }
body.compact .res svg { height: 18px; }
body.compact .bars { gap: 5px; }
body.compact .bar-row { font-size: 12px; }   /* columns: see .bars near the end */
body.compact .bar-row .num { white-space: nowrap; }
body.compact .words { grid-template-columns: 1fr; gap: 2px; }
body.compact .word { font-size: 12px; }
body.compact .legend { padding: 0 12px 4px; font-size: 11px; gap: 2px 10px; max-height: 38px; overflow-y: auto; overscroll-behavior: contain; }   /* wraps; scrolls past two rows */
body.compact #feedmeta { display: none; }
/* ---------- vertical tabs: the rail on the left picks a page */
:root { --rail: 76px; }
.share { --rail: 0px; }
.share .side .top h1::before { content: none; }
.share .rail { display: none; }
.rail { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 4px; padding: 12px 8px; background: var(--surface-1); border-right: 1px solid var(--border); min-height: 0; position: sticky; top: 0; height: 100vh; z-index: 35; overflow: hidden auto; }
.rail-logo { align-self: center; border-radius: 7px; margin: 2px 0 12px; }
.rail button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 8px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: inherit; font-size: 11px; line-height: 1.1; cursor: pointer; position: relative; }
.rail button:hover { background: var(--surface-2); color: var(--text-primary); }
.rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rail button.on { background: color-mix(in srgb, var(--accent) 13%, var(--surface-1)); color: var(--accent); font-weight: 600; }
.rail button.on::before { content: ""; position: absolute; left: -8px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-gap { flex: 1; }
.shell > .side { grid-column: 2; grid-row: 1; }
.shell > .app { grid-column: 3; grid-row: 1; }
.view { grid-column: 2 / -1; grid-row: 1; display: none; min-height: 0; min-width: 0; overflow: auto; overscroll-behavior: contain; }
.shell:not([data-view="calls"]) > .side, .shell:not([data-view="calls"]) > .app { display: none; }
.shell[data-view="people"] > #view-people, .shell[data-view="study"] > #view-study, .shell[data-view="settings"] > #view-settings { display: block; }
.view [data-a="close"] { display: none; }
/* pages */
.page { max-width: 1240px; margin: 0; padding: 26px 28px 48px; }
.page-h :is(h1, h2) { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
.page-h p { color: var(--text-secondary); margin: 0 0 16px; font-size: 13px; max-width: 640px; }
.sub-page { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.subnav { position: sticky; top: 26px; display: flex; flex-direction: column; gap: 2px; }
.subnav-h { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 0 12px 8px; }
.subnav button { text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border: 0; border-left: 3px solid transparent; border-radius: 0 9px 9px 0; background: none; font: inherit; color: var(--text-secondary); cursor: pointer; }
.subnav button b { font-weight: 550; font-size: 13px; color: var(--text-primary); }
.subnav button small { font-size: 11.5px; color: var(--text-muted); }
.subnav button:hover { background: var(--surface-2); }
.subnav button.on { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface-1)); }
.subnav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sub-body { min-width: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px 22px; box-shadow: var(--shadow); }
/* people page: everyone on the left, one person on the right */
.people-page { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 20px; height: 100vh; max-width: none; padding-bottom: 20px; }
.pp-list { display: flex; flex-direction: column; min-height: 0; }
.pp-list input { width: 100%; margin-bottom: 8px; font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.pp-list input:focus { border-color: var(--accent); }
.people-page .plist { flex: 1; min-height: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 6px; }
.prow { font: inherit; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; }
.prow:hover { background: var(--surface-2); }
.prow.on { background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); }
.prow .pc { text-align: right; line-height: 1.25; }
.pp-detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.pd-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.pd-h h2 { margin: 0 0 3px; font-size: 20px; font-weight: 650; }
.pd-sub { color: var(--text-secondary); font-size: 12.5px; }
.pd-act { display: flex; gap: 6px; flex-wrap: wrap; }
.pd-act button, .view .btns button { font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; }
.pd-act button.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.pd-lines-h { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 14px 0 4px; }
.pp-detail .plines { flex: 1; min-height: 0; overflow-y: auto; }
.pline { font: inherit; box-shadow: none; height: auto; min-height: 0; display: grid; grid-template-columns: 84px 1fr; gap: 10px; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); text-align: left; cursor: pointer; }
.pline:hover { background: var(--surface-2); }
/* settings page */
.settings-page .srow { padding: 11px 0; }
/* how reads work */
.notice { background: color-mix(in srgb, var(--warn) 12%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; }
.ftable td.fz { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.ftable td.fz.flag { color: var(--text-primary); font-weight: 650; background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tag-old { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
.empty-box { border: 1px dashed var(--border); border-radius: 10px; padding: 18px; color: var(--text-secondary); font-size: 13px; text-align: center; margin: 8px 0; }
.how-steps { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.how-steps b { color: var(--text-primary); }
.cbt td:first-child code { font-family: var(--mono); font-size: 11.5px; }
.cbt td { vertical-align: top; font-size: 12px; }
@media (max-width: 1000px) {
  .sub-page { grid-template-columns: 1fr; gap: 12px; }
  .subnav { position: static; flex-direction: row; flex-wrap: wrap; overflow: visible; gap: 4px; row-gap: 2px; }
  .subnav-h { display: none; }
  .subnav button { border-left: 0; border-bottom: 3px solid transparent; border-radius: 9px 9px 0 0; white-space: nowrap; }
  .subnav button small { display: none; }
  .subnav button.on { border-bottom-color: var(--accent); }
  .people-page { grid-template-columns: 1fr; height: auto; }
  .people-page .plist { max-height: 40vh; }
  .pp-detail { height: 70vh; }
  .page { padding: 18px 16px 32px; }
}
@media (max-width: 900px) { .rail { position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail); height: auto; } }
@media (max-width: 640px) {
  :root { --rail: 56px; }
  .share { --rail: 0px; }
  .rail { padding: 10px 6px; }
  .rail button span { display: none; }
  .rail button { padding: 10px 2px; }
  .rail button.on::before { left: -6px; }
}
/* ---------- smaller windows */
@media (max-width: 999px) {
  .shell, .shell.collapsed { grid-template-columns: var(--rail) 0 minmax(0, 1fr); }
  .side { position: fixed; left: var(--rail); top: 0; bottom: 0; width: 280px; z-index: 34; visibility: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .shell.side-open .side { visibility: visible; }
  .shell > .app { grid-column: 3; grid-row: 1; }
  body.compact #toggle-side { display: inline-flex; }
}
@media (max-width: 1150px) {
  #feedmeta { display: none; }
  .card .head { flex-wrap: wrap; row-gap: 6px; }
  .card .head input[type=search] { flex: 1 1 90px; min-width: 70px; width: auto !important; }
  .card .head .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
}
/* normal view: one column the page scrolls through */
@media (max-width: 900px) {
  body:not(.compact) { overflow: auto; }
  body:not(.compact) .shell { height: auto; min-height: 100vh; overflow: visible; }
  body:not(.compact) .app { overflow: visible; height: auto; }
  body:not(.compact) .main { display: flex; flex-direction: column; flex: none; height: auto; }
  body:not(.compact) .lcol { flex: none; }
  body:not(.compact) .lcol { overflow: visible; }
  body:not(.compact) .lcol > .card.grow { flex: none; }
  body:not(.compact) .card[data-panel="transcript"] { height: 70vh; min-height: 320px; }
}
/* compact view: every number on one row, without the small print */
@media (max-width: 1100px) {
  body.compact .kpi .sub { display: none; }
  body.compact .kpi { padding: 6px 10px; }
}
@media (max-width: 640px) {
  body.compact .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.compact .kpi:nth-child(n+4) { display: none; }
  .app { padding: 10px; }
}
/* ---------- shared view (?view=share): what other people in the call see */
.share #toggle-side, .share #toggle-compact, .share .pills, .share #banner,
.share #q, .share #export, .share .c-res, .share #act-range, .share .c-talk .meta { display: none !important; }
.share .where { font-size: 14px; }
.share header::after { content: "Live transcript · Earshot"; margin-left: auto; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
/* ---------- personality read */
.bar-row .read { font: inherit; font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-muted); cursor: pointer; opacity: 0; transition: opacity .12s; }
.bar-row:hover .read, .bar-row .read:focus-visible { opacity: 1; }
.bar-row .read:hover { color: var(--text-primary); border-color: var(--text-muted); }
@media (hover: none) { .bar-row .read { opacity: 1; } }
.share .bar-row .read { display: none; }
.modal.persona { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.persona .psub { color: var(--text-muted); font-size: 12px; margin: -4px 0 10px; }
.modal.persona .pbody { overflow-y: auto; min-height: 60px; font-size: 13px; line-height: 1.5; }
.modal.persona .pbody p { margin: 0 0 8px; color: var(--text-primary); }
.modal.persona .pbody ul { margin: 0 0 10px; padding-left: 18px; }
.modal.persona .pbody li { margin: 2px 0; }
.modal.persona .pnote { color: var(--text-muted); font-size: 11.5px; margin-top: 10px; }
/* personality report graphic */
.pbody .psum { font-size: 13.5px; font-weight: 550; color: var(--text-primary); margin: 0 0 8px; }
.pbody .psum { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pbody .ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.pbody .ptile { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 9px 10px 10px; min-width: 0; }
.pbody .ptl { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.pbody .ptl span { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pbody .ptl b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--text-primary); line-height: 1.1; }
.pbody .ptl b small { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.pbody .pseg { display: flex; gap: 3px; margin-top: 7px; }
.pbody .pseg i { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text-muted) 22%, transparent); }
.pbody .ptraits { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.pbody .ptraits span { font-size: 11.5px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }
.pbody .phead { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; }
.pbody .phead small { font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
.pbody .pbars { display: grid; gap: 2px 10px; }
.pbody .pb { display: grid; grid-template-columns: 140px 1fr 30px; align-items: center; gap: 10px; }
.pbody .pbl { font-size: 12.5px; color: var(--text-primary); }
.pbody .pbn { font-size: 11.5px; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }
.pbody .meter { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.pbody .meter b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; min-width: 2px; }
.pbody .meter .mid { position: absolute; left: 60%; top: -1px; bottom: -1px; width: 1px; background: var(--text-muted); opacity: .5; z-index: 1; }
.pbody .pbnote { grid-column: 1 / -1; font-size: 11px; color: var(--text-secondary); margin: 0 0 7px 0; line-height: 1.4; }
.pbody .pquotes { margin: 0; padding-left: 16px; }
.pbody .pquotes li { color: var(--text-secondary); font-style: italic; margin: 3px 0; }
@media (max-width: 460px) { .pbody .pb { grid-template-columns: 110px 1fr 28px; } .pbody .pbl { font-size: 12px; } }
.modal.persona .phist { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 11.5px; color: var(--text-muted); }
.modal.persona .phist button { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; }
.modal.persona .phist button.on { border-color: var(--accent); color: var(--text-primary); }
.modal.persona .pnext { font-size: 12px; color: var(--text-secondary); margin-top: 10px; }
.modal.persona .pnext .pwait { padding: 0; }
.modal.persona .perr { color: var(--bad, #e5565b); }
.spot-foot { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
.pwait { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); padding: 18px 0; }
.pwait .s { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* personalities overview (compact mode only) */
.pers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 10px; }
.pers .pp { font: inherit; text-align: left; color: inherit; background: transparent; border: 1px solid var(--grid); border-radius: 4px; padding: 7px 9px; cursor: pointer; min-width: 0; }
.pers .pp:hover { border-color: var(--text-muted); }
.pers .pn { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pers .ps { font-size: 12px; color: var(--text-primary); margin-top: 3px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pers .pt { font-size: 11px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* everyone the three cards don't cover: one "+N" line that opens into name buttons */
.pers-rest { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; max-height: 72px; overflow-y: auto; overscroll-behavior: contain; font-size: 11.5px; }
.pers-rest button { font: inherit; display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); background: transparent; border: 1px solid var(--grid); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.pers-rest button:hover { border-color: var(--text-muted); color: var(--text-primary); }
.pers-rest .tog { font-family: var(--mono); color: var(--text-muted); }
.pers-empty { grid-column: 1 / -1; color: var(--text-muted); font-size: 12px; padding: 2px 0 4px; }
/* accounts + transcribe picker */
.accts { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.acct { border: 1px solid var(--grid); border-radius: 4px; padding: 6px 8px; }
.acct.bad { border-color: var(--bad); }
.acct .an { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.acct .ar { font-weight: 500; font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--grid); border-radius: 3px; padding: 0 4px; }
.acct .as { color: var(--text-secondary); font-size: 11.5px; margin-top: 2px; }
.acct.bad .as { color: var(--bad); }
.acct .ap { color: var(--text-muted); font-size: 11px; margin-top: 2px; overflow-wrap: anywhere; }
.acct .ap.bad { color: var(--bad); }
.acct .ab { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.acct .ab button { flex: none; padding: 3px 8px; font-size: 11.5px; }
.pop { max-height: calc(100vh - 80px); overflow-y: auto; }
.pcode { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); user-select: all; white-space: nowrap; }
.tr .tg { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
.tr .tg > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .tg .flag { width: auto; height: 26px; padding: 0 8px; gap: 5px; display: inline-flex; font-size: 11.5px; font-weight: 500; color: inherit; }
.tr .tg .flag:not(.on) { opacity: .75; }
.tr .tg .flag:not(.on):hover { opacity: .9; }
.tr .flag.auto.via { color: #3987e5; opacity: .45; }
.tr .flag.auto.via:hover { opacity: .85; }
.tr .tc { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text-primary);
  background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; cursor: pointer; }
.tr .tc:hover { border-color: var(--border); background: var(--surface-2); }
.tr .tc svg { width: 14px; height: 14px; color: var(--text-muted); flex: none; }
.tr .tc em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--text-muted); }
.tr .tc-row { display: flex; align-items: center; gap: 4px; }
.tr .tc-row .tc { flex: 1; min-width: 0; }
.tr .tc-row .tc > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .flag { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid transparent;
  border-radius: 4px; background: transparent; cursor: pointer; color: var(--text-muted); opacity: .4; }
.tr .flag:hover { border-color: var(--border); background: var(--surface-2); opacity: .85; }
.tr .flag svg { width: 15px; height: 15px; }
.tr .flag.on { opacity: 1; }
.tr .flag.auto.on { color: #3987e5; }
.tr .flag.fav.on { color: #e3b341; }
/* settings */
.modal.settings .sh { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin: 14px 0 4px; }
.modal.settings .sh:first-child { margin-top: 0; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--grid); cursor: default; }
.srow span { display: flex; flex-direction: column; min-width: 0; }
.srow b { font-weight: 500; font-size: 13px; color: var(--text-primary); }
.srow small { color: var(--text-muted); font-size: 11.5px; margin-top: 1px; }
.srow input[type=checkbox] { width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
.srow.key { flex-wrap: wrap; }
.srow select { height: 30px; min-width: 180px; flex: none; }
.srow .val { color: var(--text-secondary); font-size: 13px; flex: none; }
@media (max-width: 640px) { .srow select { min-width: 0; max-width: 55%; } }
.srow .keyin { flex-direction: row; gap: 6px; align-items: center; flex: 1 1 260px; justify-content: flex-end; }
.srow .keyin input { flex: 1; min-width: 0; max-width: 240px; font: inherit; font-family: var(--mono); font-size: 12px; color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.srow .keyin input:focus { border-color: var(--accent); }
.srow.vocab { flex-direction: column; align-items: stretch; gap: 6px; }
.srow.vocab textarea { font: inherit; font-family: var(--mono); font-size: 12px; color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 64px; }
.srow.vocab textarea:focus { border-color: var(--accent); }
.srow select { height: 28px; flex: none; }
.srow button { flex: none; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; }
.no-persona .bar-row .read, .no-persona [data-panel="persona"] { display: none !important; }
#open-settings { display: none !important; }   /* Settings is a tab in the rail now; plugins still add their buttons before this spot */
/* layout editor + plugins */
#layout-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border: 1px dashed var(--accent); border-radius: var(--radius); background: var(--surface-1); font-size: 12.5px; }
#layout-bar .lb-hint, .lcol-head .lb-hint { color: var(--text-muted); font-size: 11.5px; }
#layout-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
#layout-bar button, #layout-bar select { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; height: auto; }
#layout-bar button.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
#layout-bar b { font-weight: 600; }
.lcol-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-muted); padding: 2px 2px 0; }
.lcol-head select { height: 22px; font-size: 11.5px; padding: 0 4px; }
body.editing .lcol { outline: 1px dashed var(--border); outline-offset: 3px; border-radius: 4px; min-height: 80px; overflow-y: auto; }
body.editing .lcol.drop-end { outline-color: var(--accent); }
body.editing .lcol > .card.grow { min-height: 120px; }   /* while arranging, no panel shrinks to just its title: the column scrolls instead */
body.editing .card[data-panel] { cursor: grab; }
body.editing .card.dragging { opacity: .4; }
body.editing .card.drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
.pctl { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px dashed var(--border); background: color-mix(in srgb, var(--accent) 7%, var(--surface-1)); font-size: 11.5px; }
.pctl .grip { font-weight: 600; color: var(--text-secondary); margin-right: auto; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pctl select, .pctl button { font: inherit; font-size: 11.5px; height: 22px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; }
#customize.on { color: var(--accent); border-color: var(--accent); }
.share #customize { display: none; }
.plug-deco { margin-left: 6px; }
.plug-panel .body { font-size: 12.5px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 12.5px; box-shadow: 0 8px 28px rgba(0,0,0,.18); display: none; }
.mrow input[type=checkbox] { grid-row: 1 / span 3; grid-column: 2; align-self: center; width: 16px; height: 16px; accent-color: var(--accent); }
label.mrow { cursor: pointer; }
.mrow i { font-style: normal; color: var(--accent); font-weight: 500; }
/* zoom and pan on the charts */
#act, #tl { cursor: crosshair; user-select: none; }
.zoom-band { position: absolute; display: none; background: color-mix(in srgb, var(--accent) 18%, transparent); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); pointer-events: none; }
.card .head .zoomed { font: inherit; font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; white-space: nowrap; }
.share .zoomed { display: none; }
/* ---------- house style: flat, dense, typographic (overrides the defaults above) */
:root { --radius: 6px; --shadow: none; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
body { font-size: 13.5px; }
.card, .kpi { box-shadow: none; }
.card { border-radius: var(--radius); }
.card .head { padding: 10px 14px 6px; }
.card h2 { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0; }

.settings-page .set-accts .ab button.danger { color: var(--bad); }
.settings-page .set-accts .acct { border-color: var(--border); border-radius: 8px; padding: 8px 10px; }
.settings-page .set-accts .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
.mlabel { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 10px; }
.mrow input[type=radio] { grid-row: 1 / span 3; grid-column: 2; align-self: center; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.mrow:has(input:disabled) { cursor: default; }
.pop .mrw { border-bottom: 0; padding: 10px 0 0; }
@media (max-width: 1000px) {
  .settings-page { display: block; }   /* a grid row would hold the sticky list in place; the page lets it follow */
  .settings-page .subnav { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0 0; margin: -6px 0 12px; border-bottom: 1px solid var(--border); max-width: 760px; }   /* the same width as the sections under it */
  .settings-page h1.subnav-h { display: block; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; padding: 0; }
}
@media (max-width: 900px) { body:not(.compact) #view-settings { overflow: visible; } }   /* the page scrolls here, so the jump list sticks to it */
/* call list: in compact view (every width) and under 1000px it floats over the dashboard, with a scrim and a close button */
#side-close { display: none; margin-left: auto; width: 28px; height: 28px; padding: 0; justify-content: center; }
body.compact .shell > .side { position: fixed; left: var(--rail); top: 0; bottom: 0; width: 280px; z-index: 34; visibility: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
body.compact .shell.side-open > .side { visibility: visible; }
body.compact .shell > .app { grid-column: 3; grid-row: 1; }
:root:not(.share) body.compact #side-close { display: inline-flex; }
:root:not(.share) body.compact .shell.side-open::after { content: ''; position: fixed; inset: 0 0 0 var(--rail); background: var(--scrim); z-index: 33; }
@media (max-width: 999px) {
  :root:not(.share) #side-close { display: inline-flex; }
  :root:not(.share) .shell.side-open::after { content: ''; position: fixed; inset: 0 0 0 var(--rail); background: var(--scrim); z-index: 33; }
}
/* Activity: the chart keeps at least 140px in every layout; the column scrolls instead of squashing it */
.card.grow #act { min-height: 140px; }
:root body .lcol > .card.grow.c-act[data-panel="activity"] { min-height: min-content; }
body.compact .lcol { overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
/* Personalities cards: a long name takes up to two lines instead of being cut short */
.pers .pn { white-space: normal; overflow: visible; align-items: flex-start; }
.pers .pn .swatch { margin-top: 4px; flex: none; }
.pers .pnm { min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* the status button's popover */
#pop.st { width: 330px; }
.pop .st-h { margin: 14px 0 6px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.pop .st-calls { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.pop .st-calls li { overflow-wrap: anywhere; }
.pop .st-none { margin-top: 0; }
.pop .st-fix { margin-top: 0; }
.pop .st-fix.bad { color: var(--bad); }
.pop .st-fix.warn { color: var(--text-primary); }
.pop dl + dl, .pop dl + .btns { margin-top: 10px; }
/* personality read dialog: the summary is shown whole; a body that scrolls fades at the bottom */
.modal .pbody .psum { display: block; -webkit-line-clamp: unset; overflow: visible; }
.modal.persona .pbody.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }
/* the long KPI label gives way on narrow strips (its title keeps the meaning) */
.kpis { container-type: inline-size; }
@container (max-width: 800px) { .kpi .label .lx, .kpi .label .lx2 { display: none; } }
body.compact .kpi .label .lx { display: none; }
/* a text link inside a dialog stays a text link, not a dialog button */
.modal .linkbtn { padding: 0; border: 0; background: none; border-radius: 0; min-height: 0; height: auto; font-size: inherit; }
/* talk time: "Personality read", or just "Read" when the panel is narrow (the full name is its label) */
.bar-row .read { white-space: nowrap; }
.bar-row .read .rl-short { display: none; }
@container (max-width: 560px) { .bar-row .read .rl-long { display: none; } .bar-row .read .rl-short { display: inline; } }
body.compact .bar-row .read .rl-long { display: none; } body.compact .bar-row .read .rl-short { display: inline; }
#talkmeta { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#talkmeta .linkbtn { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; vertical-align: bottom; }
/* layout editor: the hint gives way, Reset and Done stay together at the right of the first row */
#layout-bar .lb-hint { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#layout-bar .lb-end { margin-left: auto; display: inline-flex; gap: 8px; flex-shrink: 0; }
/* call list: time on the bold line, short calls folded, names with a date when two channels share one */
.call .t3 { min-width: 0; flex-wrap: wrap; row-gap: 2px; column-gap: 8px; }
.call .t3 > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.call .t3 .merged { font-style: italic; }
#feedmeta { flex: 1 1 0; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chn .cn { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fold { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 26px; font: inherit; font-size: 11.5px; text-align: left; color: var(--text-muted); background: transparent; border: 0; border-radius: 4px; padding: 4px 10px; margin-bottom: 2px; cursor: pointer; }
.fold:hover { background: var(--surface-2); color: var(--text-primary); }
.calls .fold { margin-left: 18px; width: calc(100% - 18px); }
/* transcript: on a phone-width window, a follow-on line gives its empty time column to the text */
@media (max-width: 640px) { .line.cont { grid-template-columns: minmax(0, 1fr); } .line.cont .time { display: none; } }
/* ---------- contrast, dialogs and one button style */
/* text in the accent or red colour, and white on a red fill, pass 4.5:1 in both themes */
.rail button.on, #customize.on, body.compact #toggle-compact, .mrow i, .card .head .zoomed { color: var(--accent-text); }
.ctx button.danger:hover, .ctx button.danger:focus { background: var(--bad-fill); }
/* form controls get an edge you can see (3:1); focus still turns it blue */
select, input[type=search], .pp-list input, .srow .keyin input, .srow.vocab textarea, .modal .pxin, .pd-lines-h input, .sform input, .sform select, .srowc select, #layout-bar select, .pctl select { border-color: var(--border-strong); }
:is(select, input[type=search], .pp-list input, .srow .keyin input, .srow.vocab textarea, .modal .pxin, .pd-lines-h input, .sform input, .sform select, .srowc select, #layout-bar select, .pctl select):focus { border-color: var(--accent); }
/* dialogs dim the page more in dark, and floating panels get an edge there */
.modal-bg { background: var(--scrim); }
.modal, .pop, .ctx { border-color: var(--float-edge); }
/* page panels use the same corner as the dashboard cards */
.sub-body, .pp-detail, .people-page .plist, .pp-list input, .pd-lines-h input, .sform input, .sform select, .srowc select { border-radius: var(--radius); }
/* one button: 30px tall, 12.5px text, 5px corners; .primary is the main action, .danger removes something */
.btn, .pd-act button, .view .btns button:not(.linkbtn), .pd-read .btns button, .modal .btns button:not(.linkbtn), .srow button:not(.linkbtn), .pop .btns button, #layout-bar button, .merge-bar button {
  min-height: 30px; height: auto; padding: 5px 12px; font: inherit; font-size: 12.5px; line-height: 1.25; border-radius: 5px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); cursor: pointer; box-shadow: none; }
:is(.btn, .pd-act button, .view .btns button:not(.linkbtn), .pd-read .btns button, .modal .btns button:not(.linkbtn), .srow button:not(.linkbtn), .pop .btns button, .merge-bar button):not(:disabled):hover, #layout-bar button:not(:disabled):not(.primary):hover { border-color: var(--text-muted); }
:is(.btn, .pd-act button, .view .btns button, .pd-read .btns button, .modal .btns button, .srow button, .pop .btns button, #layout-bar button, .merge-bar button):disabled { opacity: .5; cursor: default; }
:is(.btn, .pd-act button, .view .btns button, .pd-read .btns button, .modal .btns button, .srow button, .pop .btns button, #layout-bar button, .merge-bar button).primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
:is(.btn, .pd-act button, .view .btns button, .pd-read .btns button, .modal .btns button, .srow button, .pop .btns button, #layout-bar button, .merge-bar button).primary:not(:disabled):hover { background: color-mix(in srgb, var(--accent-fill) 86%, #000); border-color: color-mix(in srgb, var(--accent-fill) 86%, #000); }
.btn.danger, .modal .btns button.danger { background: var(--bad-fill); border-color: var(--bad-fill); color: #fff; }
.modal .btns button.danger:not(:disabled):hover { background: color-mix(in srgb, var(--bad-fill) 86%, #000); border-color: color-mix(in srgb, var(--bad-fill) 86%, #000); }
:is(.pop .btns, .srow, .view .btns) button.danger:not(.primary) { color: var(--bad); }
:is(.btn, .pd-act button, .view .btns button:not(.linkbtn), .pd-read .btns button, .modal .btns button:not(.linkbtn), .srow button:not(.linkbtn), .pop .btns button, #layout-bar button, .merge-bar button):not(:disabled):active { transform: translateY(.5px); filter: brightness(.96); }
#layout-bar select { min-height: 30px; }
.srow select { padding-top: 0; padding-bottom: 0; }   /* a 28px select keeps room for its text */
.pop .btns { flex-wrap: wrap; gap: 6px; }
.pop .btns button { padding-left: 6px; padding-right: 6px; }   /* three buttons fit one line in the 330px popover */
.modal .btns button[data-a="clear"] { margin-right: auto; }   /* Remove sits apart from Cancel and Save */
/* small controls still reach 24px */
.pctl select, .pctl button, .lcol-head select { height: 24px; }
.pers-rest button { min-height: 24px; }
.pers-rest { max-height: 84px; }
.modal.persona .phist button { min-height: 24px; }
/* everything they said: one tab stop, the arrows move through the lines */
.pp-detail .plines:focus-visible { outline-offset: -2px; }
.pline:focus-visible { outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
